<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>العيادة المدرسية الإلكترونية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --teal-900:#0b3d3d; --teal-700:#0f6e6e; --teal-500:#158a8a; --teal-100:#e6f3f3;
    --gold:#b08d57; --ink:#1c2b2b; --muted:#5c6f6f; --paper:#fbfaf7; --line:#d8e2e2;
    --danger:#b3452f; --warn:#a8721f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Tajawal',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;}
  .app{max-width:820px;margin:0 auto;padding:22px 16px 60px;}

  .topbar{text-align:center;background:var(--teal-900);color:#fff;padding:20px 16px;margin:-22px -16px 14px -16px;border-radius:0;}
  .topbar h1{font-size:18px;margin:0 0 4px;font-weight:900;}
  .topbar p{font-size:12.5px;margin:0;color:#bcd6d6;font-weight:500;}
  .section-title{text-align:center;color:var(--teal-900);font-size:16px;font-weight:900;margin:4px 0 16px;}
  .bottom-link{text-align:center;margin-top:22px;}
  .bottom-link a{color:var(--teal-700);font-size:13px;font-weight:700;cursor:pointer;text-decoration:underline;}
  .dash-top-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .dash-top-nav a{color:var(--teal-700);font-size:13px;font-weight:900;cursor:pointer;text-decoration:none;background:var(--teal-100);padding:9px 14px;border-radius:10px;}
  .dash-top-nav a.has-new{background:#fbe9e3;color:var(--danger);}
  .footnote.credit{margin-top:6px;color:var(--teal-900);font-weight:900;font-size:12.5px;}

  .countdown-banner{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;
    border-radius:14px;padding:18px 16px;margin-bottom:14px;font-weight:700;font-size:14px;
    background:var(--teal-100);color:var(--teal-900);
  }
  .countdown-banner.urgent{background:#fbe9e3;color:var(--danger);}
  .countdown-banner.closed{background:#eee;color:var(--muted);}
  .countdown-time{font-size:30px;font-weight:900;letter-spacing:1px;}

  .clinic-hero{background:linear-gradient(135deg,#0b3d3d,#0f6e6e);color:#fff;border-radius:16px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;}
  .clinic-hero .big{font-size:44px;font-weight:900;line-height:1;}
  .clinic-hero .lbl{font-size:13px;font-weight:800;}
  .clinic-hero .d{font-size:11px;opacity:.85;margin-top:3px;}
  .clinic-hero .mini{display:flex;flex-direction:column;gap:5px;font-size:11.5px;font-weight:700;}
  .clinic-hero .mini b{font-size:15px;}
  .clinic-bar{display:flex;gap:8px;margin-bottom:10px;}
  .clinic-bar input{flex:1;}
  .clinic-tabs{display:flex;gap:6px;margin-bottom:10px;}
  .clinic-tab{flex:1;text-align:center;padding:8px;border-radius:9px;background:var(--teal-100);font-size:12.5px;font-weight:800;color:var(--teal-900);cursor:pointer;}
  .clinic-tab.on{background:var(--teal-900);color:#fff;}
  .clinic-day{font-size:12.5px;font-weight:900;color:var(--teal-900);display:flex;justify-content:space-between;align-items:center;margin:12px 0 6px;}
  .clinic-day span{background:var(--teal-100);border-radius:10px;padding:2px 10px;}
  .clinic-card{background:#fff;border:1px solid var(--line);border-right:5px solid var(--teal-700,#0f6e6e);border-radius:12px;padding:11px 13px;margin-bottom:8px;}
  .clinic-card.open{border-color:var(--teal-500);border-right-color:var(--teal-700,#0f6e6e);}
  .clinic-card-top{display:flex;gap:11px;align-items:center;cursor:pointer;}
  .clinic-time{font-size:12px;font-weight:900;color:var(--teal-700,#0f6e6e);background:var(--teal-100);border-radius:8px;padding:6px 8px;text-align:center;min-width:46px;}
  .clinic-nm{font-size:14px;font-weight:900;}
  .clinic-meta{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .clinic-tag{background:#fff3e0;color:#7a4b00;border-radius:8px;padding:1px 8px;font-weight:800;}
  .clinic-tag.g{background:#e3f4e8;color:#1b6b3a;}
  .clinic-vc{text-align:center;font-size:10px;color:var(--muted);}
  .clinic-vc b{display:block;font-size:17px;color:var(--teal-900);}
  .reason-chip.sel{background:var(--danger);color:#fff;}
  .hist-box{border:1.5px solid #e0a43a;background:#fffaf0;border-radius:12px;overflow:hidden;margin-top:8px;}
  .hist-head{background:#fff3e0;padding:8px 12px;font-size:13px;font-weight:900;color:#7a4b00;}
  .hist-sec{padding:8px 12px;border-top:1px dashed #ecd9b0;}
  .hist-sec h4{margin:0 0 5px;font-size:12px;font-weight:900;color:var(--teal-900);}
  .hist-cond{font-size:12.5px;line-height:1.8;}
  .hist-tag{background:#fbe9e3;color:#a02a1c;border-radius:8px;padding:1px 9px;font-weight:900;font-size:12px;margin-left:6px;}
  .hist-row{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:3px 0;border-bottom:1px dotted #e6dcc4;}
  .hist-row:last-child{border-bottom:none;}
  .hist-row span{color:var(--muted);white-space:nowrap;}
  .hist-ok{background:#e3f4e8;color:#1b6b3a;border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:800;margin-top:8px;}
  .notice-card{background:#fff;border:1px solid var(--line);border-right:5px solid var(--danger);border-radius:12px;padding:11px 13px;margin-bottom:8px;}
  .notice-card.done{border-right-color:#1b6b3a;opacity:.8;}
  .notice-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .notice-tag{border-radius:8px;padding:2px 9px;font-weight:800;font-size:11.5px;background:#fbe9e3;color:#a02a1c;}
  .notice-tag.t{background:var(--teal-100);color:var(--teal-900);}
  .reason-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .reason-chip{font-size:12px;font-weight:700;padding:5px 11px;border-radius:20px;background:var(--teal-100);color:var(--teal-900);cursor:pointer;user-select:none;}
  .reason-chip.add{background:#fff;border:1.5px dashed var(--teal-500);color:var(--teal-700);}
  .msg-alert{background:#fff3e0;border:1.5px solid #e0a43a;border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;cursor:pointer;}
  .msg-alert .t{font-size:13.5px;font-weight:900;color:#7a4b00;display:flex;align-items:center;gap:8px;}
  .msg-alert .s{font-size:11.5px;color:#7a5a27;margin-top:3px;}
  .msg-alert .dot{width:10px;height:10px;border-radius:50%;background:#d93025;flex:none;animation:msgpulse 1.2s infinite;}
  .msg-alert .open{font-size:12px;font-weight:900;color:#fff;background:#0f6e6e;border-radius:8px;padding:8px 14px;white-space:nowrap;}
  .nav-badge{display:inline-block;background:#d93025;color:#fff;font-size:10.5px;font-weight:900;min-width:18px;height:18px;line-height:18px;border-radius:9px;text-align:center;padding:0 5px;}
  @keyframes msgpulse{0%,100%{opacity:1}50%{opacity:.3}}
  .welcome-box{background:var(--teal-100);border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:13.5px;line-height:1.8;color:var(--teal-900);text-align:center;}
  .year-line{text-align:center;font-size:12px;color:#bcd6d6;margin-top:6px;}
  .year-line b{color:#fff;}

  .logout-link{text-align:center;margin-top:10px;}
  .logout-link a{color:var(--danger);font-size:12.5px;font-weight:700;cursor:pointer;text-decoration:underline;}

  .stat{cursor:pointer;transition:.15s;}
  .stat:hover{filter:brightness(0.97);}
  .list-row{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--line);font-size:13.5px;}
  .autocomplete-list{position:absolute;z-index:50;background:#fff;border:1.5px solid var(--teal-500);border-radius:9px;margin-top:4px;max-height:230px;overflow-y:auto;width:100%;box-shadow:0 8px 20px rgba(0,0,0,.14);}
  .autocomplete-item{padding:10px 12px;font-size:13.5px;cursor:pointer;border-bottom:1px solid var(--line);}
  .autocomplete-item:last-child{border-bottom:none;}
  .autocomplete-item:hover, .autocomplete-item.active{background:var(--teal-100);}
  .list-row:last-child{border-bottom:none;}
  .id-edit-row{display:flex;gap:8px;align-items:center;}
  .id-edit-row input{flex:1;padding:7px 10px;font-size:13px;}
  .entry-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
  @media(max-width:640px){.entry-row{grid-template-columns:1fr;}}
  .counselor-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:100%;}
  .counselor-card .icon-circle{width:52px;height:52px;border-radius:50%;background:var(--teal-100);display:flex;align-items:center;justify-content:center;font-size:24px;}
  .chat-request-card{background:var(--teal-100);border-radius:14px;padding:18px;text-align:center;margin-bottom:14px;}
  .chat-request-card h3{margin:0 0 6px;color:var(--teal-900);font-size:15px;}
  .chat-request-card p{margin:0 0 12px;color:var(--muted);font-size:12.5px;}
  .icon-btn{background:none;border:none;color:var(--teal-700);cursor:pointer;font-size:13px;text-decoration:underline;padding:0;}

  .chat-fab{position:fixed;bottom:18px;left:18px;z-index:60;background:var(--teal-700);color:#fff;border:none;border-radius:30px;padding:12px 18px;font-family:inherit;font-weight:900;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;display:flex;align-items:center;gap:6px;}
  .chat-fab .dot{width:8px;height:8px;border-radius:50%;background:#ff6b5e;display:none;}
  .chat-fab.has-new .dot{display:inline-block;}
  .chat-modal{background:#fff;border-radius:16px 16px 0 0;max-width:480px;width:100%;max-height:82vh;display:flex;flex-direction:column;}
  @media(min-width:640px){.chat-modal{border-radius:16px;}}
  .chat-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);}
  .chat-head h3{margin:0;font-size:15px;color:var(--teal-900);}
  .chat-body{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-height:200px;}
  .chat-bubble{max-width:80%;padding:9px 13px;border-radius:12px;font-size:13.5px;line-height:1.6;}
  .chat-bubble.parent{align-self:flex-start;background:var(--teal-100);color:var(--teal-900);border-bottom-left-radius:3px;}
  .chat-bubble.counselor{align-self:flex-end;background:var(--teal-700);color:#fff;border-bottom-right-radius:3px;}
  .chat-bubble .meta{display:block;font-size:10.5px;opacity:.75;margin-top:4px;}
  .chat-input-row{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);}
  .chat-input-row textarea{flex:1;min-height:42px;max-height:100px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:13.5px;resize:none;}
  .chat-input-row button{flex:0 0 auto;background:var(--teal-700);color:#fff;border:none;border-radius:10px;padding:0 16px;font-weight:900;cursor:pointer;}
  .chat-empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 10px;}
  .chat-thread-row{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
  .chat-thread-row:last-child{border-bottom:none;}
  .chat-thread-row b{font-size:13.5px;color:var(--teal-900);}
  .chat-thread-row .prev{font-size:11.5px;color:var(--muted);margin-top:2px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .chat-thread-row.thread-unread{background:#fbf8f0;margin:0 -10px;padding:12px 10px;border-radius:8px;}
  .unread-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-left:6px;vertical-align:middle;}

  .welcome-image-overlay{position:fixed;inset:0;background:rgba(5,25,25,.92);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;}
  .welcome-image-box{position:relative;max-width:480px;width:100%;}
  .welcome-image-box img{width:100%;border-radius:14px;display:block;}
  .welcome-image-close{position:absolute;top:10px;left:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.95);border:none;color:var(--teal-900);font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.4);line-height:1;}

  @media print{
    #app > *{display:none !important;}
    #app > #print-area{display:block !important;}
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{position:absolute;top:0;right:0;left:0;padding:0;margin:0;height:auto;}
    html, body{height:auto !important;}
    .print-header{text-align:center;font-weight:900;font-size:16px;margin-bottom:4px;}
    .print-sub{text-align:center;font-size:12px;margin-bottom:14px;color:#333;}
    .print-row{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid #999;font-size:13px;}
    .print-table{width:100%;border-collapse:collapse;font-size:12.5px;}
    .print-table th,.print-table td{border:1px solid #888;padding:6px 8px;text-align:right;}
    .print-table th{background:#eee;font-weight:900;}
    .print-table tr{page-break-inside:avoid;}
    .print-group-title{font-weight:900;font-size:13.5px;margin:14px 0 6px;padding-top:8px;border-top:2px solid #333;page-break-after:avoid;break-after:avoid;}
    .print-footer{text-align:center;font-size:11.5px;color:#555;margin-top:22px;padding-top:10px;border-top:1px solid #999;}
    .report-block{border:1px solid #333;border-radius:6px;padding:14px;margin-bottom:10px;page-break-inside:avoid;}
    .report-block .r-row{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:1px dashed #bbb;font-size:12.5px;}
    .report-block .r-row:last-child{border-bottom:none;}
    .report-block .r-title{font-weight:900;font-size:14.5px;text-align:center;margin-bottom:10px;}
    .sig-row{display:flex;justify-content:space-between;margin-top:26px;font-size:12px;}
    .sig-row div{width:45%;text-align:center;border-top:1px solid #555;padding-top:6px;}
    @page{margin:10mm 8mm;}
    body.printing-thermal{width:50mm;}
    body.printing-thermal #print-area{width:50mm;box-sizing:border-box;padding:2.5mm;font-size:10px;border:0.6mm solid #000;}
    body.printing-thermal .print-header{font-size:13px;line-height:1.4;margin-bottom:4px;padding-bottom:4px;border-bottom:1px solid #000;}
    body.printing-thermal .print-sub{font-size:9px;margin-bottom:7px;}
    body.printing-thermal .report-block{padding:0;border:none;margin-bottom:0;}
    body.printing-thermal .report-block .r-title{font-size:11.5px;margin-bottom:6px;}
    body.printing-thermal .report-block .r-row{font-size:9.5px;line-height:1.5;padding:4px 0;flex-direction:column;gap:2px;border-bottom:1px dotted #999;}
    body.printing-thermal .report-block .r-row:last-child{border-bottom:none;}
    body.printing-thermal .report-block .r-row span{color:#444;font-size:8.5px;}
    body.printing-thermal .report-block .r-row b{font-size:10.5px;}
    body.printing-thermal .slip-thermal{text-align:center;}
    body.printing-thermal .st-gap{height:6mm;}
    body.printing-thermal .st-gap.b{height:10mm;}
    body.printing-thermal .st-logo{display:block;width:24mm;height:auto;margin:0 auto 2px;}
    body.printing-thermal .st-school{font-size:13.5px;font-weight:900;line-height:1.4;}
    body.printing-thermal .st-title{font-size:15px;font-weight:900;border:0.5mm solid #000;border-radius:2mm;padding:3px 2px;margin:6px 0;}
    body.printing-thermal .st-f{padding:4px 0;border-bottom:0.3mm dotted #666;}
    body.printing-thermal .st-f span{display:block;font-size:11px;color:#222;}
    body.printing-thermal .st-f b{display:block;font-size:15.5px;font-weight:900;line-height:1.35;}
    body.printing-thermal .st-cnt{border:0.4mm solid #000;border-radius:2mm;padding:3px;margin:6px 0 2px;font-size:12.5px;font-weight:900;}
    body.printing-thermal .st-msg{font-size:12.5px;font-weight:900;margin:6px 0 3px;line-height:1.5;}
    body.printing-thermal .st-foot{font-size:12.5px;font-weight:800;border-top:0.5mm solid #000;padding-top:5px;margin-top:6px;}
    body.printing-thermal .print-footer{font-size:8.5px;margin-top:8px;padding-top:6px;border-top:1px solid #000;}
    body.printing-thermal .sig-row{display:none;}
    body.printing-thermal .print-table{font-size:8.5px;}
    body.printing-thermal .print-table th,body.printing-thermal .print-table td{padding:2.5px 3px;}
  }

  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;}
  .card h2{font-size:16px;margin:0 0 14px;color:var(--teal-900);font-weight:900;border-bottom:2px solid var(--teal-100);padding-bottom:10px;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:560px){.grid2{grid-template-columns:1fr;}}

  label{display:block;font-size:13px;font-weight:700;color:var(--teal-900);margin-bottom:5px;}
  .field{margin-bottom:14px;}
  .hint{font-size:11.5px;color:var(--muted);margin-top:4px;}
  input[type=text],input[type=tel],input[type=datetime-local],textarea,select{
    width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;font-family:inherit;font-size:14px;color:var(--ink);background:#fff;
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--teal-500);}
  textarea{resize:vertical;min-height:60px;}

  .cond-list{display:flex;flex-direction:column;}
  .cond-item{border-bottom:1px solid var(--line);padding:12px 4px;}
  .cond-item:last-child{border-bottom:none;}
  .cond-head{display:flex;align-items:flex-start;gap:10px;cursor:pointer;}
  .cond-head input[type=checkbox]{width:20px;height:20px;flex:0 0 20px;margin-top:1px;accent-color:var(--teal-700);cursor:pointer;}
  .cond-title{font-weight:700;font-size:14.5px;}
  .cond-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .cond-detail{margin-top:8px;margin-right:30px;display:none;}
  .cond-detail.show{display:block;}

  .confirm-box{display:flex;align-items:flex-start;gap:10px;background:var(--teal-100);border-radius:10px;padding:14px;margin-top:6px;}
  .confirm-box input{width:20px;height:20px;flex:0 0 20px;margin-top:2px;accent-color:var(--teal-700);}
  .confirm-box span{font-size:13.5px;line-height:1.6;}

  .btn{display:inline-block;width:100%;padding:13px;border-radius:10px;border:none;background:var(--teal-700);color:#fff;font-family:inherit;font-weight:900;font-size:15px;cursor:pointer;}
  .btn:hover{background:var(--teal-900);}
  .btn:disabled{background:#a9bcbc;cursor:not-allowed;}
  .btn-outline{background:#fff;color:var(--teal-700);border:1.5px solid var(--teal-700);}
  .btn-outline:hover{background:var(--teal-100);}
  .btn-wa{background:#25D366;}
  .btn-wa:hover{background:#1ea952;}
  .btn-row{display:flex;gap:10px;}
  .btn-row .btn{width:auto;flex:1;}

  .err{color:var(--danger);font-size:12.5px;margin-top:4px;display:none;}
  .err.show{display:block;}
  .warn-box{background:#fff6ea;border:1px solid #f0d9a8;color:var(--warn);border-radius:10px;padding:14px;font-size:13.5px;line-height:1.7;margin-bottom:14px;}
  .warn-box b{display:block;margin-bottom:4px;font-size:14px;}

  .success{text-align:center;padding:40px 20px;}
  .success .icon{width:64px;height:64px;border-radius:50%;background:var(--teal-100);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:30px;color:var(--teal-700);}
  .success h2{color:var(--teal-900);font-size:18px;margin-bottom:8px;border:none;}
  .success p{color:var(--muted);font-size:14px;line-height:1.7;}
  .success .meta{background:var(--teal-100);border-radius:10px;padding:12px;margin:16px 0;font-size:13px;text-align:right;}

<script>
/* ============================================================
   إعدادات Supabase — عدّل السطرين التاليين فقط بمعلومات مشروعك
   من: Supabase Dashboard → Settings → API
   ============================================================ */
const SUPABASE_URL = 'https://yclpmibmojmvokcdthba.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_37p0wHFHCfBN5RPFP5Uu2A_ZPTfpq5Z';
/* ============================================================ */

const SETUP_NEEDED = SUPABASE_URL.indexOf('YOUR_SUPABASE') === 0 || SUPABASE_ANON_KEY.indexOf('YOUR_SUPABASE') === 0;
let sb = null;
if(!SETUP_NEEDED){
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

const LOCAL_PREFIX = 'hesham_health_';
function localGet(key){ try{ const v = localStorage.getItem(LOCAL_PREFIX+key); return v? JSON.parse(v): null; }catch(e){ return null; } }
function localSet(key, val){ try{ localStorage.setItem(LOCAL_PREFIX+key, JSON.stringify(val)); }catch(e){} }

/* ---------- عدّاد زيارات وزوّار العيادة الإلكترونية ---------- */
function getVisitorId(){
  let id = localGet('visitor_id');
  if(!id){
    id = 'v_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,10);
    localSet('visitor_id', id);
  }
  return id;
}
function visitsFooterHtml(){
  const vs = state.visitStats;
  return `
    <div class="visits-footer">
      <div class="visit-item">👁️ عدد الزوار: <b>${vs? vs.visits : '—'}</b></div>
      <div class="visit-sep"></div>
      <div class="visit-item">👤 عدد المستخدمين: <b>${vs? vs.visitors : '—'}</b></div>
      ${vs && vs.notReady? `<span style="font-size:10.5px;color:var(--danger);">— نفّذ ملف supabase-migration-visits.sql في Supabase لتفعيل العدّاد</span>`:''}
      <div class="visit-explain">عدد الزوار = إجمالي مرات فتح الصفحة • عدد المستخدمين = عدد الأجهزة المختلفة التي زارت الصفحة</div>
    </div>`;
}
async function logSiteVisit(){
  try{
    if(!sb) return;
    await sb.from('site_visits').insert({ visitor_id: getVisitorId() });
  }catch(e){ /* الجدول قد لا يكون منشأ بعد — تجاهل بصمت */ }
}
async function loadVisitStats(){
  if(!sb){ state.visitStats = { visits:0, visitors:0, notReady:true }; render(); return; }
  try{
    const { data, error } = await sb.from('site_visits').select('visitor_id');
    if(error) throw error;
    const rows = data || [];
    state.visitStats = { visits: rows.length, visitors: new Set(rows.map(r=>r.visitor_id)).size, notReady:false };
    render();
  }catch(e){
    state.visitStats = { visits:0, visitors:0, notReady:true };
    render();
  }
}

function rowToRecord(row){
  return {
    nationalId: row.national_id,
    studentName: row.student_name,
    classGrade: row.class_grade,
    section: row.section,
    parentMobile: row.parent_mobile,
    altMobile: row.alt_mobile || '',
    conditions: row.conditions || {},
    notes: row.notes || '',
    submittedAt: row.submitted_at,
    updatedAt: row.updated_at,
    editCount: row.edit_count || 0,
    confirmationSent: !!row.confirmation_sent,
  };
}
function recordToRow(rec){
  return {
    national_id: rec.nationalId,
    student_name: rec.studentName,
    class_grade: rec.classGrade,
    section: rec.section,
    parent_mobile: rec.parentMobile,
    alt_mobile: rec.altMobile,
    conditions: rec.conditions,
    notes: rec.notes,
    submitted_at: rec.submittedAt,
    updated_at: rec.updatedAt,
    edit_count: rec.editCount,
    confirmation_sent: !!rec.confirmationSent,
  };
}

async function fetchSubmission(nationalId){
  if(!sb){ return localGet('sub_'+nationalId); }
  try{
    const { data, error } = await sb.from('submissions').select('*').eq('national_id', nationalId).maybeSingle();
    if(error) throw error;
    const rec = data ? rowToRecord(data) : null;
    if(rec) localSet('sub_'+nationalId, rec);
    return rec;
  }catch(e){
    return localGet('sub_'+nationalId);
  }
}

async function saveSubmission(record){
  localSet('sub_'+record.nationalId, record);
  if(!sb) return true;
  const { error } = await sb.from('submissions').upsert(recordToRow(record), {onConflict:'national_id'});
  if(error) throw error;
  return true;
}

    state.roster = (data||[]).map(r=>({name:r.name, nationalId:r.national_id, classGrade:r.class_grade||'', section:r.section||''}));
    localSet('roster', state.roster);
  }catch(e){
    state.roster = localGet('roster') || [];
  }
  return state.roster;
}

async function ensureSettings(){
  if(state.settings) return state.settings;
  const fallbackDefault = () => {
    const d = new Date(); d.setDate(d.getDate()+DEFAULT_DEADLINE_DAYS);
    return {
      pin:'123456', deadline: d.toISOString(), academicYear:'1447/1448هـ',
      healthCounselorPhone:'', schoolPhone:'', studentCounselorPhone:'', deputyPrincipalPhone:'',
      msgConfirmation: DEFAULT_MSG_CONFIRMATION, msgReassurance: DEFAULT_MSG_REASSURANCE, msgReminder: DEFAULT_MSG_REMINDER, msgMedicalReport: DEFAULT_MSG_MEDICAL_REPORT,
      welcomeImage: null, exitImage: null, welcomeMessage:'', goodbyeMessage:'',
    };
  };
  if(!sb){
    state.settings = localGet('settings') || fallbackDefault();
    return state.settings;
  }
  try{
    const { data, error } = await sb.from('settings').select('*').eq('id',1).maybeSingle();
    if(error) throw error;
    if(data){
      const def = fallbackDefault();
      state.settings = {
        pin: data.pin, deadline: data.deadline, academicYear: data.academic_year || def.academicYear,
        healthCounselorPhone: data.health_counselor_phone || '', schoolPhone: data.school_phone || '', studentCounselorPhone: data.student_counselor_phone || '', deputyPrincipalPhone: data.deputy_principal_phone || '',
        msgConfirmation: data.msg_confirmation || def.msgConfirmation,
        msgReassurance: data.msg_reassurance || def.msgReassurance,
        msgReminder: data.msg_reminder || def.msgReminder,
        msgMedicalReport: data.msg_medical_report || def.msgMedicalReport,
        welcomeImage: data.welcome_image || null,
        exitImage: data.exit_image || null,
        welcomeMessage: data.welcome_message || '',
        goodbyeMessage: data.goodbye_message || '',
      };
    } else {
      const def = fallbackDefault();
      await sb.from('settings').insert({
        id:1, pin: def.pin, deadline: def.deadline, academic_year: def.academicYear,
        health_counselor_phone: def.healthCounselorPhone, school_phone: def.schoolPhone, student_counselor_phone: def.studentCounselorPhone, deputy_principal_phone: def.deputyPrincipalPhone,
        msg_confirmation: def.msgConfirmation, msg_reassurance: def.msgReassurance, msg_reminder: def.msgReminder, msg_medical_report: def.msgMedicalReport,
      });
      state.settings = def;
    }
    localSet('settings', state.settings);
  }catch(e){
    state.settings = localGet('settings') || fallbackDefault();
  }
  return state.settings;
}

/* ---------- COUNTDOWN ---------- */
let countdownTimer = null;
function renderCountdown(){
  const deadline = state.settings ? new Date(state.settings.deadline) : null;
  if(!deadline) return '';
  const diff = deadline - new Date();
  if(diff <= 0){
    return `<div class="countdown-banner closed">⏱️ انتهت المهلة المحددة لتسجيل بيانات المرحلة الأولى — لا يزال بإمكانكم التسجيل، لكن يرجى الإسراع</div>`;
  }
  const days = Math.floor(diff/86400000);
  const hours = Math.floor((diff%86400000)/3600000);
  const mins = Math.floor((diff%3600000)/60000);
  const secs = Math.floor((diff%60000)/1000);
  const urgent = diff < 3*86400000;
  return `
    <div class="countdown-banner ${urgent?'urgent':''}" id="countdown-box">
      <span>⏱️ الوقت المتبقي لإغلاق تسجيل المرحلة الأولى</span>
      <span class="countdown-time" id="countdown-time">${days} يوم ${pad(hours)}:${pad(mins)}:${pad(secs)}</span>
    </div>`;
}
function pad(n){ return n.toString().padStart(2,'0'); }
function startCountdownTicker(){
  if(countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(()=>{
    const box = document.getElementById('countdown-time');
    if(!box || !state.settings) return;
    const diff = new Date(state.settings.deadline) - new Date();
    if(diff<=0){ render(); return; }
    const days = Math.floor(diff/86400000);
    const hours = Math.floor((diff%86400000)/3600000);
    const mins = Math.floor((diff%3600000)/60000);
    const secs = Math.floor((diff%60000)/1000);
    box.textContent = `${days} يوم ${pad(hours)}:${pad(mins)}:${pad(secs)}`;
  }, 1000);
}

/* ---------- بحث الأسماء: مطابقة بداية الاسم الأول فقط، بدون حساسية للهمزة ---------- */
function normalizeHamzaLoose(s){
  return (s||'').toString()
    .replace(/[\u064B-\u065F\u0670\u0640]/g,'')   // تشكيل + تطويل
    .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
    .replace(/ؤ/g,'و').replace(/ئ/g,'ي')
    .replace(/\s+/g,' ').trim();
}
// بحث ببداية الاسم: يدعم اسمًا كاملًا من عدة كلمات، ويتجاهل المسافات (عبد الله = عبدالله)
function firstNameStartsWith(fullName, query){
  const q = normalizeHamzaLoose(query);
  if(!q) return true;
  const name = normalizeHamzaLoose(fullName);
  if(name.startsWith(q)) return true;
  return name.replace(/\s/g,'').startsWith(q.replace(/\s/g,''));
}
function nameMatchesQuery(fullName, query){
  const q = normalizeHamzaLoose(query).trim();
  if(!q) return true;
  const norm = normalizeHamzaLoose(fullName);
  const words = norm.split(/\s+/).filter(Boolean);
  if(words.some(w => w.startsWith(q))) return true;
  return norm.includes(q);
}

  return s.name + (cs? (' — '+cs) : '');
}

/* ---------- الفصل والشعبة: توحيد صيغ الإدخال المختلفة ---------- */
function normalizeArabicForMatch(s){
  let v = (s||'').toString().trim();
  if(/[\/,-]/.test(v)) v = v.split(/[\/,-]/)[0]; // "أ/ا" أو "1-أ" ونحوها: خذ أول جزء فقط
  return v.trim()
    .replace(/[أإآ]/g,'ا')
    .replace(/ة/g,'ه')
    .replace(/\s+/g,'')
    .replace(/^(الصف|صف|فصل|الفصل|شعبه|الشعبه)/,'');
}
const GRADE_VARIANTS = [
  {canon:'الأول', variants:['1','١','اول','الاول','أول','الأول','واحد','ا']},
  {canon:'الثاني', variants:['2','٢','ثاني','الثاني','اثنين','ب']},
  {canon:'الثالث', variants:['3','٣','ثالث','الثالث','ثلاثة','ثلاثه','ج']},
  {canon:'الرابع', variants:['4','٤','رابع','الرابع','اربعة','اربعه','د']},
  {canon:'الخامس', variants:['5','٥','خامس','الخامس','خمسة','خمسه','ه','هـ']},
  {canon:'السادس', variants:['6','٦','سادس','السادس','ستة','سته','و']},
];
const SECTION_VARIANTS = [
  {canon:'الأولى', variants:['1','١','اول','اولى','الاولى','أولى','الأولى','واحد','ا','أ']},
  {canon:'الثانية', variants:['2','٢','ثاني','ثانية','الثانية','اثنين','ب']},
  {canon:'الثالثة', variants:['3','٣','ثالث','ثالثة','الثالثة','ثلاثة','ثلاثه','ج']},
  {canon:'الرابعة', variants:['4','٤','رابع','رابعة','الرابعة','اربعة','اربعه','د']},
  {canon:'الخامسة', variants:['5','٥','خامس','خامسة','الخامسة','خمسة','خمسه','ه','هـ']},
  {canon:'السادسة', variants:['6','٦','سادس','سادسة','السادسة','ستة','سته','و']},
];
function normalizeClassGrade(raw){
  const norm = normalizeArabicForMatch(raw);
  if(!norm) return (raw||'').toString().trim();
  for(const g of GRADE_VARIANTS){
    if(g.variants.some(v=> normalizeArabicForMatch(v)===norm)) return g.canon;
  }
  return (raw||'').toString().trim();
}
function normalizeSection(raw){
  const norm = normalizeArabicForMatch(raw);
  if(!norm) return (raw||'').toString().trim();
  for(const s of SECTION_VARIANTS){
    if(s.variants.some(v=> normalizeArabicForMatch(v)===norm)) return s.canon;
  }
  return (raw||'').toString().trim();
}

function openEditStudentModal(nationalId){
  const r = (state.roster||[]).find(x=>x.nationalId===nationalId);
  const sub = (state.submissions||[]).find(x=>x.nationalId===nationalId);
  const name = (r&&r.name) || (sub&&sub.studentName) || '';
  const grade = (r&&r.classGrade) || (sub&&sub.classGrade) || '';
  const section = (r&&r.section) || (sub&&sub.section) || '';
  const gradeOpts = GRADE_VARIANTS.map(g=>g.canon); if(grade && !gradeOpts.includes(grade)) gradeOpts.push(grade);
  const secOpts = SECTION_VARIANTS.map(x=>x.canon); if(section && !secOpts.includes(section)) secOpts.push(section);
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" style="max-width:400px;">
      <div class="modal-top">
        <h2 style="border:none;margin:0;">تعديل بيانات الطالب</h2>
        <button class="modal-close" id="edit-student-close">×</button>
      </div>
      <p style="font-size:12px;color:var(--muted);margin-bottom:12px;">رقم الهوية: ${esc(nationalId)} (لا يتغير)</p>
      <div class="field"><label>اسم الطالب</label><input type="text" id="edit-student-name" value="${esc(name)}"></div>
      <div class="grid2">
        <div class="field"><label>الصف</label><select id="edit-student-grade"><option value="">—</option>${gradeOpts.map(g=>`<option value="${esc(g)}" ${g===grade?'selected':''}>${esc(g)}</option>`).join('')}</select></div>
        <div class="field"><label>الشعبة</label><select id="edit-student-section"><option value="">—</option>${secOpts.map(g=>`<option value="${esc(g)}" ${g===section?'selected':''}>${esc(g)}</option>`).join('')}</select></div>
      </div>
      <div class="hint">يُحدَّث الاسم في كشف الطلاب والبيانات المسجلة وبلاغات الغياب ومراجعات العيادة والمحادثات.</div>
      <div class="err" id="edit-student-err"></div>
      <button class="btn" id="edit-student-save" style="width:100%;">حفظ التعديل</button>
    </div>`;
  document.body.appendChild(overlay);
  const close = ()=>{ if(overlay.parentNode) document.body.removeChild(overlay); };
  overlay.querySelector('#edit-student-close').onclick = close;
  overlay.querySelector('#edit-student-save').onclick = async ()=>{
    const newName = overlay.querySelector('#edit-student-name').value.replace(/\s+/g,' ').trim();
    const newGrade = overlay.querySelector('#edit-student-grade').value;
    const newSection = overlay.querySelector('#edit-student-section').value;
    const btn = overlay.querySelector('#edit-student-save'); const errBox = overlay.querySelector('#edit-student-err');
    if(!newName){ errBox.textContent = 'يرجى كتابة اسم الطالب.'; errBox.classList.add('show'); return; }
    btn.disabled = true; btn.textContent = 'جاري الحفظ...';
    try{
      if(sb){
        const r1 = await sb.from('roster').update({ name:newName, class_grade:newGrade||null, section:newSection||null }).eq('national_id', nationalId);
        if(r1.error) throw r1.error;
        await sb.from('submissions').update({ student_name:newName, class_grade:newGrade, section:newSection }).eq('national_id', nationalId);
        await Promise.all(['absence_reports','clinic_visits','messages'].map(t=> sb.from(t).update({ student_name:newName }).eq('national_id', nationalId)));
      }
      if(r){ r.name = newName; r.classGrade = newGrade; r.section = newSection; localSet('roster', state.roster); }
      if(sub){ sub.studentName = newName; sub.classGrade = newGrade; sub.section = newSection; }
      (state.absenceReports||[]).forEach(x=>{ if(x.nationalId===nationalId) x.studentName = newName; });
      (state.clinicVisits||[]).forEach(x=>{ if(x.nationalId===nationalId) x.studentName = newName; });
      (state.messageThreads||[]).forEach(x=>{ if(x.nationalId===nationalId) x.studentName = newName; });
      if(state.activeDetail && state.activeDetail.nationalId===nationalId){ state.activeDetail.studentName = newName; state.activeDetail.classGrade = newGrade; state.activeDetail.section = newSection; }
      close(); render();
    }catch(e){
      errBox.textContent = 'تعذر الحفظ، تحقق من الاتصال وحاول مرة أخرى.'; errBox.classList.add('show');
      btn.disabled = false; btn.textContent = 'حفظ التعديل';
    }
  };
}

      errBox.classList.add('show');
      btn.disabled = false; btn.textContent = 'حفظ النقل';
    }
  };
}

async function normalizeExistingClassSectionData(){
  if(!sb) throw new Error('no supabase');
  let rosterUpdated = 0, subsUpdated = 0;

  const { data: rosterRows, error: rosterErr } = await sb.from('roster').select('national_id,class_grade,section');
  if(rosterErr) throw rosterErr;
  for(const r of (rosterRows||[])){
    const oldClass = r.class_grade || '', oldSection = r.section || '';
    const newClass = normalizeClassGrade(oldClass);
    const newSection = normalizeSection(oldSection);
    if(newClass !== oldClass || newSection !== oldSection){
      await sb.from('roster').update({ class_grade: newClass||null, section: newSection||null }).eq('national_id', r.national_id);
      rosterUpdated++;
    }
  }

  const { data: subRows, error: subErr } = await sb.from('submissions').select('national_id,class_grade,section');
  if(subErr) throw subErr;
  for(const s of (subRows||[])){
    const oldClass = s.class_grade || '', oldSection = s.section || '';
    const newClass = normalizeClassGrade(oldClass);
    const newSection = normalizeSection(oldSection);
    if(newClass !== oldClass || newSection !== oldSection){
      await sb.from('submissions').update({ class_grade: newClass||null, section: newSection||null }).eq('national_id', s.national_id);
      subsUpdated++;
    }
  }

  state.roster = null;
  state.submissions = null;
  await ensureRoster();
  await loadSubmissions();

  return { rosterUpdated, subsUpdated };
}

function matchOfficialRoster(){
  const roster = state.roster || [];
  const norm = n => (n||'').toString().trim().replace(/\s+/g,' ');
  const rosterByName = new Map();
  roster.forEach(s=>{ const k = norm(s.name); if(!rosterByName.has(k)) rosterByName.set(k, []); rosterByName.get(k).push(s); });
  const exact = [], fuzzy = [], notFound = [];
  for(const [name, grade, section] of OFFICIAL_ROSTER){
    const key = norm(name);
    const matches = rosterByName.get(key) || [];
    if(matches.length === 1){
      const s = matches[0];
      const changed = (s.classGrade||'') !== grade || (s.section||'') !== section;
      exact.push({official:{name,grade,section}, roster:s, changed});
    } else if(matches.length > 1){
      fuzzy.push({official:{name,grade,section}, candidates: matches});
    } else {
      const nf = normalizeArabicForMatch(name).replace(/\s+/g,'');
      const cands = roster.filter(s=> normalizeArabicForMatch(s.name).replace(/\s+/g,'') === nf && nf);
      if(cands.length){
        fuzzy.push({official:{name,grade,section}, candidates: cands});
      } else {
        notFound.push({name,grade,section});
      }
    }
  }
  return { exact, fuzzy, notFound };
}

async function applyOfficialRosterMatches(items){
  if(!sb) throw new Error('no supabase');
  let updated = 0;
  for(const it of items){
    await sb.from('roster').update({ class_grade: it.grade, section: it.section }).eq('national_id', it.nationalId);
    await sb.from('submissions').update({ class_grade: it.grade, section: it.section }).eq('national_id', it.nationalId);
    updated++;
  }
  state.roster = null;
  state.submissions = null;
  await ensureRoster();
  await loadSubmissions();
  return updated;
}

    const name = state.selName.trim();
    const id = state.selId.trim();
    if(!name || !id){ state.selErr = 'يرجى إدخال اسم الطالب ورقم الهوية.'; render(); return; }
    const match = state.roster.find(s => s.name === name);
    if(!match){ state.selErr = 'لم يتم العثور على هذا الاسم ضمن كشف الطلاب، يرجى اختيار الاسم من القائمة المنسدلة.'; render(); return; }
    if(match.nationalId !== id){ state.selErr = 'رقم الهوية غير مطابق لهذا الطالب.'; render(); return; }
    state.selErr = null;

    // check existing submission
    let existing = await fetchSubmission(id);

    if(existing && !state.editMode){
      state.existingRecord = existing;
      state.selErr = null;
      render();
      showAlreadyRegisteredModal();
      return;
    }

    // proceed to fill form (new or confirmed edit)
    if(existing){
      state.formData = recordToFormData(existing);
      state.editMode = true;
    } else {
      state.formData = emptyForm();
      state.editMode = false;
    }
    // الفصل والشعبة معتمدان من كشف الطلاب الرسمي، وليسا قابلين للتعديل من ولي الأمر
    state.formData.classGrade = match.classGrade || '';
    state.formData.section = match.section || '';
    state.formStep = 'fill';
    state.parentSession = true;
    saveParentSession();
    render();
  };
}

function recordToFormData(rec){
  const conditions = {};
  CONDITIONS.forEach(c => conditions[c.key] = rec.conditions[c.key] ? {...rec.conditions[c.key]} : {checked:false, detail:''});
  return {
    classGrade: rec.classGrade||'', section: rec.section||'',
    parentMobile: rec.parentMobile||'', altMobile: rec.altMobile||'',
    conditions, notes: rec.notes||'', confirmed:false,
  };
}

async function submitForm(){

  state.err = null;
  const btn = document.getElementById('f-submit');
  btn.disabled = true; btn.textContent = 'جاري الحفظ...';

  const now = new Date().toISOString();
  const prev = state.existingRecord && state.editMode ? state.existingRecord : null;

  const record = {
    nationalId: state.selId,
    studentName: state.selName,
    classGrade: f.classGrade.trim(),
    section: f.section.trim(),
    parentMobile: f.parentMobile.trim(),
    altMobile: f.altMobile.trim(),
    conditions: f.conditions,
    notes: f.notes.trim(),
    submittedAt: prev ? prev.submittedAt : now,
    updatedAt: now,
    editCount: prev ? (prev.editCount||0) + 1 : 0,
    confirmationSent: false,
  };

  try{
    await saveSubmission(record);
    state.successRecord = record;
    state.successImageShown = false;
    state.formStep = 'success';
    state.existingRecord = null;
    saveParentSession();
    render();
  }catch(err){
    state.err = 'تعذر حفظ البيانات، يرجى المحاولة مرة أخرى.';
    btn.disabled = false; btn.textContent = state.editMode? 'حفظ التعديل' : 'إرسال البيانات للمدرسة';
    render();
  }
}

async function loadSubmissions(){
  state.loadingDash = true; render();
  try{
    if(!sb) throw new Error('no supabase configured');
    const { data, error } = await sb.from('submissions').select('*');
    if(error) throw error;
    const items = (data||[]).map(rowToRecord);
    items.sort((a,b)=> new Date(b.updatedAt||b.submittedAt) - new Date(a.updatedAt||a.submittedAt));
    const seenIds = localGet('seen_submission_ids');
    if(seenIds){
      const seenSet = new Set(seenIds);
      const freshIds = items.filter(it=>!seenSet.has(it.nationalId)).map(it=>it.nationalId);
      if(freshIds.length){
        const merged = new Set([...(state.newSubmissionIds||[]), ...freshIds]);
        state.newSubmissionIds = [...merged];
      }
    }
    localSet('seen_submission_ids', items.map(it=>it.nationalId));
    state.submissions = items;
    localSet('all_submissions', items);
  }catch(e){
    state.submissions = localGet('all_submissions') || [];
  }
  state.loadingDash = false;
  render();
  subscribeRealtime();
  subscribeChatRealtime();
  loadMessageThreads();
  loadAbsenceReports();
  loadHealthNotices();
  loadVisitStats();
}

function buildThreads(rows){
  const byId = {};
  (rows||[]).forEach(row=>{
    const msg = rowToMessage(row);
    if(!byId[msg.nationalId]){
      byId[msg.nationalId] = { nationalId: msg.nationalId, studentName: msg.studentName, lastBody: msg.body, lastAt: msg.createdAt, lastSender: msg.sender, lastReadAt: msg.readAt, count: 1, unread: false, unreadCount: 0 };
    } else {
      byId[msg.nationalId].count++;
    }
    if(msg.sender==='parent' && !msg.readAt){ byId[msg.nationalId].unread = true; byId[msg.nationalId].unreadCount++; }
  });
  return Object.values(byId).sort((a,b)=> new Date(b.lastAt) - new Date(a.lastAt));
}

async function loadMessageThreads(){
  if(!sb) return;
  try{
    const { data, error } = await sb.from('messages').select('*').order('created_at', {ascending:false});
    if(error) throw error;
    state.messageThreads = buildThreads(data);
    render();
  }catch(e){ state.messageThreads = state.messageThreads || []; }
}

/* ---------- نغمة التنبيه + الفحص الدوري كل 5 ثوانٍ ---------- */
const BASE_TITLE = document.title;
let audioCtx = null;
function unlockAudio(){
  try{
    if(!audioCtx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) audioCtx = new AC(); }
    if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){}
}
['pointerdown','touchstart','keydown','click'].forEach(ev=>document.addEventListener(ev, unlockAudio, {passive:true}));
function playTone(){
  try{
    unlockAudio(); if(!audioCtx) return;
    const t0 = audioCtx.currentTime;
    [[880,0],[1175,0.2],[1320,0.4]].forEach(([freq,d])=>{
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type='sine'; o.frequency.value = freq;
      o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001, t0+d);
      g.gain.exponentialRampToValueAtTime(0.4, t0+d+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+d+0.32);
      o.start(t0+d); o.stop(t0+d+0.35);
    });
  }catch(e){}
}
const seenMsgIds = new Set();
let noticesSeeded = false, counselorSeeded = false, parentSeededFor = null, pollBusy = false;

function unreadMessagesTotal(){
  return (state.messageThreads||[]).reduce((a,t)=> a + (t.unread? (t.unreadCount||1) : 0), 0);

function refreshAlertUI(){
  const slot = document.getElementById('msg-alert-slot');
  if(slot) slot.innerHTML = msgAlertHtml() + noticeAlertHtml();
  const nlink = document.getElementById('open-notices-view-top');
  if(nlink){ nlink.innerHTML = noticesNavHtml(); nlink.classList.toggle('has-new', noticesTodayUnfollowed().length>0); }

    openParentChat();

});
function renderKeepFocus(){
  const a = document.activeElement; let id=null, val, ss, se;
  if(a && a.id && (a.tagName==='INPUT'||a.tagName==='TEXTAREA')){ id=a.id; val=a.value; try{ss=a.selectionStart; se=a.selectionEnd;}catch(e){} }
  render();
  if(id){ const el = document.getElementById(id); if(el){ if(el.value!==val) el.value=val; try{ el.focus(); if(ss!=null) el.setSelectionRange(ss,se); }catch(e){} } }
}

async function pollCounselor(){
  const { data, error } = await sb.from('messages').select('*').order('created_at', {ascending:false}).limit(600);
  if(error || !data) return;
  let fresh = false;
  data.forEach(r=>{
    if(!seenMsgIds.has(r.id)){ seenMsgIds.add(r.id); if(counselorSeeded && r.sender==='parent') fresh = true; }
  });
  counselorSeeded = true;
  const threads = buildThreads(data);
  const sig = threads.map(t=>t.nationalId+':'+t.count+':'+t.unreadCount).join('|');
  const changed = sig !== state._threadSig;
  state._threadSig = sig;
  let chatChanged = false;
  if(state.activeChatThread){
    const mine = data.filter(r=>r.national_id===state.activeChatThread).map(rowToMessage).reverse();
    if(mine.length !== (state.dashChatMessages||[]).length){
      state.dashChatMessages = mine; chatChanged = true;
      markThreadRead(state.activeChatThread, 'counselor');
      const t = threads.find(x=>x.nationalId===state.activeChatThread); if(t){ t.unread=false; t.unreadCount=0; }
    }
  }
  try{
    const nr = await sb.from('health_notices').select('*').order('created_at', {ascending:false}).limit(500);
    if(!nr.error && nr.data){
      let freshN = false;
      nr.data.forEach(r=>{ const k='n'+r.id; if(!seenMsgIds.has(k)){ seenMsgIds.add(k); if(noticesSeeded) freshN = true; } });
      noticesSeeded = true;
      state.healthNotices = nr.data.map(rowToNotice);
      if(freshN) playTone();
      if(state.statView==='notices' && state.tab==='dash' && freshN) renderKeepFocus();
    }
  }catch(e){}
  state.messageThreads = threads;
  if(fresh){ playTone(); if(!state.activeChatThread) state.dashHasNewMessage = true; }
  if(chatChanged || (changed && state.statView==='messages' && state.tab==='dash')) renderKeepFocus();
  refreshAlertUI();
}

async function pollParent(){
  const id = (state.chatSession && state.chatSession.nationalId) || (state.parentSession && state.selId);
  if(!id) return;
  const { data, error } = await sb.from('messages').select('*').eq('national_id', id).order('created_at', {ascending:true});
  if(error || !data) return;
  const msgs = data.map(rowToMessage);
  if(parentSeededFor !== id){
    parentSeededFor = id;
    msgs.forEach(m=>seenMsgIds.add(m.id));
    if(!state.showChat && msgs.some(m=>m.sender==='counselor' && !m.readAt)){ state.chatHasNew = true; }
    refreshAlertUI(); return;
  }
  let fresh = false;
  msgs.forEach(m=>{ if(!seenMsgIds.has(m.id)){ seenMsgIds.add(m.id); if(m.sender==='counselor') fresh = true; } });
  if(fresh){ playTone(); if(!state.showChat) state.chatHasNew = true; }
  if(state.showChat && state.chatSession && state.chatSession.nationalId===id && msgs.length !== (state.chatMessages||[]).length){
    state.chatMessages = msgs;
    markThreadRead(id, 'parent');
    renderKeepFocus();
  }
  refreshAlertUI();
}

let realtimeChannel = null;
function subscribeRealtime(){
  if(!sb || realtimeChannel) return;
  try{
    realtimeChannel = sb.channel('submissions-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'submissions' }, (payload) => {
        if(!state.submissions) return;
        if(payload.eventType === 'DELETE'){
          const oldId = payload.old && payload.old.national_id;
          state.submissions = state.submissions.filter(s=>s.nationalId!==oldId);
        } else {
          const rec = rowToRecord(payload.new);
          const idx = state.submissions.findIndex(s=>s.nationalId===rec.nationalId);
          if(idx>=0) state.submissions[idx] = rec; else {
            state.submissions.unshift(rec);
            if(!(state.newSubmissionIds||[]).includes(rec.nationalId)){
              state.newSubmissionIds = [...(state.newSubmissionIds||[]), rec.nationalId];
            }
            const seen = localGet('seen_submission_ids') || [];
            if(!seen.includes(rec.nationalId)) localSet('seen_submission_ids', [...seen, rec.nationalId]);
          }
        }
        localSet('all_submissions', state.submissions);
        if(state.tab === 'dash' && state.dashUnlocked && !state.loadingDash){
          render();
        }
      })
      .subscribe();
  }catch(e){ realtimeChannel = null; }
}

/* ---------- CHAT ---------- */
let chatRealtimeChannel = null;
function subscribeChatRealtime(){
  if(!sb || chatRealtimeChannel) return;
  try{
    chatRealtimeChannel = sb.channel('messages-live')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
        const msg = rowToMessage(payload.new);
        const isNewMsg = !seenMsgIds.has(msg.id); seenMsgIds.add(msg.id);
        if(isNewMsg){
          if(state.dashUnlocked && state.tab!=='form' && msg.sender==='parent') playTone();
          else if(state.tab==='form' && msg.sender==='counselor' && state.chatSession && msg.nationalId===state.chatSession.nationalId) playTone();
        }
        // parent-side open thread
        if(state.tab==='form' && state.showChat && state.chatSession && msg.nationalId===state.chatSession.nationalId){
          if(!state.chatMessages.some(m=>m.id===msg.id)) state.chatMessages.push(msg);
          render();
        }
        // counselor-side open thread
        if(state.tab==='dash' && state.activeChatThread===msg.nationalId){
          if(!state.dashChatMessages.some(m=>m.id===msg.id)) state.dashChatMessages.push(msg);
          render();
        }
        // counselor-side notification flag while browsing dashboard elsewhere
        if(state.tab==='dash' && state.dashUnlocked && msg.sender==='parent' && state.activeChatThread!==msg.nationalId){
          state.dashHasNewMessage = true;
          render();
        }
        if(state.tab==='dash' && state.dashUnlocked){
          loadMessageThreads();
        }
        if(state.tab==='form' && msg.sender==='counselor' && !state.showChat && state.chatSession && msg.nationalId===state.chatSession.nationalId){
          state.chatHasNew = true;
          render();
        }
      })
      .subscribe();
  }catch(e){ chatRealtimeChannel = null; }
}

function rowToMessage(row){
  return { id: row.id, nationalId: row.national_id, studentName: row.student_name, sender: row.sender, body: row.body, createdAt: row.created_at, readAt: row.read_at || null };
}

async function markThreadRead(nationalId, readerSender){
  // readerSender: 'parent' أو 'counselor' — يضع علامة "قُرئت" على رسائل الطرف الآخر في هذه المحادثة
  if(!sb || !nationalId) return;
  const otherSender = readerSender === 'parent' ? 'counselor' : 'parent';
  try{
    await sb.from('messages').update({ read_at: new Date().toISOString() })
      .eq('national_id', nationalId).eq('sender', otherSender).is('read_at', null);
  }catch(e){ /* تجاهل — قد يكون عمود read_at غير منشأ بعد */ }
}

function formatMsgDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('ar-SA', {weekday:'long', year:'numeric', month:'long', day:'numeric'}) + ' - ' + d.toLocaleTimeString('ar-SA', {hour:'2-digit', minute:'2-digit'});
}
function formatDateTimeShort(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return '';
  return d.toLocaleDateString('ar-SA', {year:'numeric', month:'2-digit', day:'2-digit'}) + ' — ' + d.toLocaleTimeString('ar-SA', {hour:'2-digit', minute:'2-digit'});
}

async function loadChatMessages(nationalId){
  try{
    if(!sb) return [];
    const { data, error } = await sb.from('messages').select('*').eq('national_id', nationalId).order('created_at', {ascending:true});
    if(error) throw error;
    return (data||[]).map(rowToMessage);
  }catch(e){ return []; }
}

async function sendChatMessage(nationalId, studentName, sender, body){
  if(!sb) return null;
  const row = { national_id: nationalId, student_name: studentName, sender, body };
  const { data, error } = await sb.from('messages').insert(row).select();
  if(error) throw error;
  return data && data[0] ? rowToMessage(data[0]) : null;
}

const CHAT_FAB_POS_KEY = 'chatFabPos_v1';
function loadChatFabPos(){
  try{ const raw = localStorage.getItem(CHAT_FAB_POS_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function saveChatFabPos(pos){
  try{ localStorage.setItem(CHAT_FAB_POS_KEY, JSON.stringify(pos)); }catch(e){}
}
function chatFabStyle(){
  const pos = loadChatFabPos();
  if(!pos) return '';
  return `left:${pos.left}px;top:${pos.top}px;right:auto;bottom:auto;`;
}
function bindChatFabDrag(fab){
  let dragging = false, moved = false, startX=0, startY=0, startLeft=0, startTop=0;
  const onMove = (e)=>{
    if(!dragging) return;
    const point = e.touches ? e.touches[0] : e;
    const dx = point.clientX - startX, dy = point.clientY - startY;
    if(Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
    if(!moved) return;
    if(e.cancelable) e.preventDefault();
    let newLeft = startLeft + dx, newTop = startTop + dy;
    const maxLeft = window.innerWidth - fab.offsetWidth - 4;
    const maxTop = window.innerHeight - fab.offsetHeight - 4;
    newLeft = Math.max(4, Math.min(newLeft, maxLeft));
    newTop = Math.max(4, Math.min(newTop, maxTop));
    fab.style.left = newLeft + 'px';
    fab.style.top = newTop + 'px';
    fab.style.right = 'auto';
    fab.style.bottom = 'auto';
  };
  const onUp = ()=>{
    if(!dragging) return;
    dragging = false;
    if(moved){
      const rect = fab.getBoundingClientRect();
      saveChatFabPos({ left: Math.round(rect.left), top: Math.round(rect.top) });
    } else {
      openParentChat();
    }
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
    window.removeEventListener('touchmove', onMove);
    window.removeEventListener('touchend', onUp);
  };
  const onDown = (e)=>{
    const point = e.touches ? e.touches[0] : e;
    dragging = true; moved = false;
    const rect = fab.getBoundingClientRect();
    startX = point.clientX; startY = point.clientY;
    startLeft = rect.left; startTop = rect.top;
  };
  fab.onmousedown = (e)=>{ onDown(e); window.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onUp); };
  fab.ontouchstart = (e)=>{ onDown(e); window.addEventListener('touchmove', onMove, {passive:false}); window.addEventListener('touchend', onUp); };
}

    const btn = overlay.querySelector('#notice-submit'); btn.disabled = true; btn.textContent = 'جاري الإرسال...';
    try{
      await submitHealthNotice({ nationalId: match.nationalId, studentName: name, conditions: conds, requests: reqs, temperature: temp, details });
      close();
      alert('وصل إشعاركم للموجه الصحي، وسيراعي حالة ابنكم في المدرسة ويتواصل معكم عند الحاجة. سلامة ابنكم وعافيته.');

    }
  };
}

function studentHealthHistoryHtml(nationalId){

  const visits = (state.clinicVisits||[]).filter(v=>v.nationalId===nationalId).slice().sort((a,b)=>String(b.visitDate).localeCompare(String(a.visitDate)));

function parseSlip(str){

/* ---------- CLINIC VISITS UI ---------- */
function localDateStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function clinicCounts(visits){
  const now = new Date(); const today = localDateStr(now);
  const y = new Date(now); y.setDate(y.getDate()-1);
  const ws = new Date(now); ws.setDate(ws.getDate()-ws.getDay());
  const wsStr = localDateStr(ws), month = today.slice(0,7);
  return {
    today: visits.filter(v=>v.visitDate===today).length,
    yesterday: visits.filter(v=>v.visitDate===localDateStr(y)).length,
    week: visits.filter(v=>v.visitDate>=wsStr && v.visitDate<=today).length,
    month: visits.filter(v=>(v.visitDate||'').slice(0,7)===month).length,
    todayStr: today, wsStr, monthStr: month,
  };
}
function renderClinic(){
  if(state.showClinicForm) return renderClinicFormPage();
  state.clinicPrefill = null;
  const all = state.clinicVisits || [];
  const c = clinicCounts(all);
  const period = state.clinicPeriod || 'today';
  const q = (state.clinicSearch||'').trim();
  let visits = all.filter(v=>{
    if(period==='today') return v.visitDate===c.todayStr;
    if(period==='week') return v.visitDate>=c.wsStr && v.visitDate<=c.todayStr;
    if(period==='month') return (v.visitDate||'').slice(0,7)===c.monthStr;
    return true;
  });
  if(q) visits = visits.filter(v=>nameMatchesQuery(v.studentName, q));
  visits = visits.slice().sort((a,b)=> String(b.visitDate).localeCompare(String(a.visitDate)) || String(b.visitTime||'').localeCompare(String(a.visitTime||'')));
  const totalByStudent = {};
  all.forEach(v=>{ if(v.nationalId) totalByStudent[v.nationalId] = (totalByStudent[v.nationalId]||0)+1; });
  const days = [];
  visits.forEach(v=>{ let d = days.find(x=>x.date===v.visitDate); if(!d){ d={date:v.visitDate, list:[]}; days.push(d); } d.list.push(v); });
  const tabs = [['today','اليوم'],['week','الأسبوع'],['month','الشهر'],['all','الكل']];

          </div>

        </div>
        ${isOpen ? `

          <div class="btn-row" style="margin-top:10px;">

            <button class="btn btn-wa" data-wa-clinic="${esc(v.id)}" style="flex:1;font-size:12.5px;">إرسال لولي الأمر</button>

    ${days.length===0? `<div class="card empty">لا توجد مراجعات في هذه الفترة.</div>` :

function bindLiveAutocomplete(inputId, listId, options, onPick, matchFn){
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);
  if(!input || !list) return;
  const match = matchFn || ((text, q)=> text.includes(q));
  const renderSuggestions = ()=>{
    const q = input.value.trim();
    if(!q){ list.innerHTML=''; list.style.display='none'; return; }
    const matches = options.filter(o => match((o.matchText||o.label), q)).slice(0, 80);
    if(matches.length===0){ list.innerHTML=''; list.style.display='none'; return; }
    list.innerHTML = matches.map((o,i)=>`<div class="autocomplete-item" data-idx="${i}">${esc(o.display||o.label)}</div>`).join('');
    list.style.display='block';
    list.querySelectorAll('.autocomplete-item').forEach((item,i)=>{
      item.onmousedown = (e)=>{
        e.preventDefault();
        onPick(matches[i], input);
        list.innerHTML=''; list.style.display='none';
      };
    });
  };
  input.oninput = renderSuggestions;
  input.onfocus = renderSuggestions;
  input.onblur = ()=>{ setTimeout(()=>{ list.innerHTML=''; list.style.display='none'; }, 150); };
}

function bindClinicEvents(){
  document.querySelectorAll('[data-clinic-period]').forEach(el=>{
    el.onclick = ()=>{ state.clinicPeriod = el.dataset.clinicPeriod; render(); };
  });
  const clinicSearch = document.getElementById('clinic-search');

  const openAdd = document.getElementById('open-add-clinic-visit');

  document.querySelectorAll('[data-toggle-clinic]').forEach(el=>{

      const id = el.dataset.toggleClinic;

    };
  });

  const formBack = document.getElementById('clinic-form-back');
  if(formBack) formBack.onclick = ()=>{ state.showClinicForm=false; state.editingClinicVisit=null; render(); };

  if(state.showClinicForm){
    const roster = sortedRoster();
    bindLiveAutocomplete('clinic-name', 'clinic-name-suggestions',
      roster.map(s=>({label:s.name, display: (studentConditionsSummary(s.nationalId)? '⚠️ ':'') + rosterOptionLabel(s), nationalId:s.nationalId})),
      (picked, input)=>{
        input.value = picked.label;
        input.dataset.nationalId = picked.nationalId;
        const badgeEl = document.getElementById('clinic-chronic-badge');
        if(badgeEl) badgeEl.innerHTML = chronicBadgeHtml(picked.nationalId);
        const histEl = document.getElementById('clinic-history');
        if(histEl) histEl.innerHTML = studentHealthHistoryHtml(picked.nationalId);
      },
      firstNameStartsWith);
    bindLiveAutocomplete('clinic-complaint', 'clinic-complaint-suggestions',
      clinicReasons().map(c=>({label:c})),
      (picked, input)=>{ input.value = picked.label; });
  }

  const saveBtn = document.getElementById('clinic-form-save');
  if(saveBtn) saveBtn.onclick = async ()=>{
    const nameInput = document.getElementById('clinic-name');
    const name = nameInput.value.trim();
    const date = document.getElementById('clinic-date').value;
    const time = document.getElementById('clinic-time').value;
    const teacher = document.getElementById('clinic-teacher').value.trim();
    const complaint = document.getElementById('clinic-complaint').value.trim();
    const actions = document.getElementById('clinic-actions').value.trim();
    const outcome = document.getElementById('clinic-outcome').value;
    const notes = document.getElementById('clinic-notes').value.trim();
    const parentContacted = document.getElementById('clinic-parent-contacted').checked;
    const slipKey = document.getElementById('clinic-slip').value;
    const booksVal = document.getElementById('clinic-books').value;
    const slipDef0 = CLINIC_SLIP_TYPES.find(x=>x.key===slipKey);
    const slipType = slipKey + ((slipDef0 && slipDef0.hasBooks && booksVal)? '|'+booksVal : '');
    const errBox = document.getElementById('clinic-form-err');
    if(!name || !date || !complaint){
      errBox.textContent = 'يرجى تعبئة اسم الطالب والتاريخ ونوع الشكوى على الأقل.';
      errBox.classList.add('show'); return;
    }
    const match = (state.roster||[]).find(s=>s.name===name);
    const nationalId = match? match.nationalId : (nameInput.dataset.nationalId || (state.editingClinicVisit? state.editingClinicVisit.nationalId : null));
    const editId = state.editingClinicVisit ? state.editingClinicVisit.id : null;
    const btn = document.getElementById('clinic-form-save');
    btn.disabled = true; btn.textContent = 'جاري الحفظ...';
    try{
      const saved = await saveClinicVisit({
        nationalId, studentName: name, visitDate: date, visitTime: time,
        teacherName: teacher, complaintType: complaint, actionsTaken: actions,
        outcome, additionalNotes: notes, parentContacted, slipType,
      }, editId);
      if(saved){
        if(editId){
          const idx = state.clinicVisits.findIndex(x=>String(x.id)===String(editId));
          if(idx>=0) state.clinicVisits[idx] = saved;
        } else {
          state.clinicVisits.unshift(saved);
        }
      }
      state.showClinicForm = false;
      state.editingClinicVisit = null;
      render();
    }catch(e){
      errBox.textContent = 'تعذر الحفظ، تحقق من الاتصال بالإنترنت.';
      errBox.classList.add('show');
      btn.disabled = false; btn.textContent = editId? 'حفظ التعديلات':'حفظ المراجعة';
    }
  };
}

function sendClinicVisitToParent(v){
  const phone = findParentMobileForNationalId(v.nationalId) || prompt('أدخل رقم جوال ولي أمر الطالب "'+v.studentName+'" لإرسال رسالة عبر واتساب:');
  if(!phone) return;
  const msg = `السلام عليكم ورحمة الله وبركاته\nمعك الموجه الصحي بابتدائية هشام بن عبد الملك بالخرج\nنحيطكم علمًا بأن ${v.studentName} راجع العيادة المدرسية بتاريخ ${v.visitDate}${v.visitTime? (' الساعة '+v.visitTime):''}\nالشكوى: ${v.complaintType}${v.actionsTaken? '\nالإجراء المتخذ: '+v.actionsTaken:''}${v.outcome? '\nالنتيجة: '+v.outcome:''}\nنتمنى له/لها دوام الصحة والعافية.`;
  window.open('https://wa.me/'+normalizePhone(phone)+'?text='+encodeURIComponent(msg), '_blank');
  if(!v.parentContacted){
    v.parentContacted = true;
    render();
    if(sb) sb.from('clinic_visits').update({parent_contacted:true}).eq('id', v.id).then(()=>{}).catch(()=>{});
  }
}

            `;}).join('')}

function getStudentNameById(id){
  if(!id) return '';
  const fromSub = (state.submissions||[]).find(s=>s.nationalId===id);
  if(fromSub) return fromSub.studentName;
  const fromRoster = (state.roster||[]).find(s=>s.nationalId===id);
  return fromRoster ? fromRoster.name : '';
}

function getStudentClassSectionById(id){
  if(!id) return '';
  const fromSub = (state.submissions||[]).find(s=>s.nationalId===id);
  if(fromSub && (fromSub.classGrade||fromSub.section)) return [fromSub.classGrade, fromSub.section].filter(Boolean).join(' ');
  const fromRoster = (state.roster||[]).find(s=>s.nationalId===id);
  if(fromRoster && (fromRoster.classGrade||fromRoster.section)) return [fromRoster.classGrade, fromRoster.section].filter(Boolean).join(' ');
  return '';
}

function bindChatOverlayEvents(mode){
  const isParent = mode === 'parent';
  const overlay = document.getElementById('chat-overlay');
  const body = document.getElementById('chat-body');
  if(body) body.scrollTop = body.scrollHeight;

  const close = document.getElementById('chat-close');
  if(close) close.onclick = ()=>{
    if(isParent){ state.showChat = false; } else { state.activeChatThread = null; }
    render();
  };

  const input = document.getElementById('chat-input');
  const insertReminder = document.getElementById('chat-insert-reminder');
  if(insertReminder) insertReminder.onclick = ()=>{
    const name = getStudentNameById(state.activeChatThread) || '';
    const msg = fillTemplate(state.settings.msgReminder, { name });
    state.dashChatInput = msg;
    if(input) input.value = msg;
  };
  if(input) input.oninput = e => { if(isParent) state.chatInput = e.target.value; else state.dashChatInput = e.target.value; };

  const sendBtn = document.getElementById('chat-send');
  if(sendBtn) sendBtn.onclick = async ()=>{
    const val = (input ? input.value : '').trim();
    if(!val) return;
    sendBtn.disabled = true;
    try{
      const nationalId = isParent ? state.chatSession.nationalId : state.activeChatThread;
      const studentName = isParent ? state.chatSession.name : getStudentNameById(state.activeChatThread);
      const sender = isParent ? 'parent' : 'counselor';
      const saved = await sendChatMessage(nationalId, studentName, sender, val);
      if(saved){
        if(isParent){ state.chatMessages.push(saved); state.chatInput = ''; }
        else { state.dashChatMessages.push(saved); state.dashChatInput = ''; }
      }
      render();
    }catch(e){ alert('تعذر إرسال الرسالة، تحقق من الاتصال بالإنترنت.'); }
    finally{ sendBtn.disabled = false; }
  };
}

function countConditions(rec){
  return CONDITIONS.filter(c => c.key!=='none' && rec.conditions[c.key] && rec.conditions[c.key].checked).length;
}

function studentConditionsSummary(nationalId){
  if(!nationalId) return null;
  const sub = (state.submissions||[]).find(s=>s.nationalId===nationalId);
  if(!sub) return null;
  const active = CONDITIONS.filter(c=>c.key!=='none' && sub.conditions && sub.conditions[c.key] && sub.conditions[c.key].checked);
  if(active.length===0) return null;
  return active.map(c=>c.title).join('، ');
}
function chronicBadgeHtml(nationalId){
  const summary = studentConditionsSummary(nationalId);
  if(!summary) return '';
  return `<div class="chronic-badge">⚠️ حالة مزمنة: ${esc(summary)}</div>`;
}

function countUniqueParents(subs){
  const set = new Set();
  (subs||[]).forEach(s=>{ if(s.parentMobile) set.add(normalizePhone(s.parentMobile)); });
  return set.size;
}

function getMissingStudents(){
  const subs = state.submissions || [];
  const registeredIds = new Set(subs.map(s=>s.nationalId));
  return (state.roster||[]).filter(s => !registeredIds.has(s.nationalId));
}

function renderDashboard(){
  if(state.loadingDash) return `<div class="card loading">جاري تحميل البيانات...</div>`;
  const subs = state.submissions || [];
  const q = state.search.trim();
  let filtered = q ? subs.filter(s => nameMatchesQuery(s.studentName, q) || (s.parentMobile||'').includes(q) || (s.nationalId||'').includes(q)) : subs;
  if((state.newSubmissionIds||[]).length){
    const newSet = new Set(state.newSubmissionIds);
    filtered = [...filtered.filter(s=>newSet.has(s.nationalId)), ...filtered.filter(s=>!newSet.has(s.nationalId))];
  }
  const withConditionsList = subs.filter(s => countConditions(s) > 0);
  const missing = getMissingStudents();
  const roster = state.roster || [];

  return `
    <div class="dash-toolbar">
      <button class="btn" id="open-advanced-print" style="order:-1;">🖨️ طباعة متقدمة (فرز وفلترة)</button>
      <input type="text" placeholder="بحث بالاسم / رقم الهوية / الجوال" id="dash-search" value="${esc(state.search)}">
      <button class="btn btn-outline" id="dash-refresh">تحديث</button>
      <button class="btn btn-outline" id="dash-export">تصدير Excel</button>
    </div>

    <div class="stat-row">
      <div class="stat" data-view="all"><b>${roster.length}</b><span>إجمالي الطلاب</span></div>
      <div class="stat" data-view="registered"><b>${subs.length}</b><span>سجّلوا بياناتهم</span></div>
      <div class="stat missing" data-view="missing"><b>${missing.length}</b><span>لم يسجلوا بعد</span></div>
      <div class="stat parents" data-view="parents"><b>${countUniqueParents(subs)}</b><span>عدد أولياء الأمور</span></div>
      <div class="stat" data-view="withConditions"><b>${withConditionsList.length}</b><span>لديهم حالات صحية</span></div>
      <div class="stat" data-view="absences"><b>${(state.absenceReports||[]).length}</b><span>بلاغات الغياب</span></div>
    </div>

    ${visitsFooterHtml()}

    ${q ?
      (filtered.length===0 ? `<div class="card empty">لا توجد نتائج مطابقة لـ «${esc(q)}».</div>` :
      filtered.map(s => renderSubCard(s)).join('')) :
      (state.statView ? renderStatView(state.statView, {roster, subs, withConditionsList, missing}) :
      (filtered.length===0 ? `<div class="card empty">لا توجد نماذج مطابقة حتى الآن.</div>` :
      filtered.map(s => renderSubCard(s)).join('')))}

    <div class="settings-link">
      <a id="open-settings">الإعدادات (الرمز / الموعد النهائي / العام الدراسي / كشف الطلاب)</a>
    </div>
    ${state.activeDetail ? renderDetailModal(state.activeDetail) : ''}
    ${state.showSettings ? renderSettingsModal() : ''}
  `;
}

function toLocalInputValue(iso){
  const d = new Date(iso);
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,16);
}

function bindDashboardExtras(){
  const search = document.getElementById('dash-search');
  if(search) search.oninput = e => { state.search = e.target.value; withFocusPreserved(render); };

  const refresh = document.getElementById('dash-refresh');
  if(refresh) refresh.onclick = loadSubmissions;

  const exportBtn = document.getElementById('dash-export');
  if(exportBtn) exportBtn.onclick = exportExcel;

  document.querySelectorAll('.stat[data-view]').forEach(el=>{
    el.onclick = ()=>{ state.statView = el.dataset.view; render(); };
  });
  document.querySelectorAll('[data-notice-tab]').forEach(el=>{ el.onclick = ()=>{ state.noticeTab = el.dataset.noticeTab; render(); }; });
  const closeStatView = document.getElementById('close-stat-view');
  if(closeStatView) closeStatView.onclick = ()=>{ state.statView = null; render(); };
  const printStatView = document.getElementById('print-stat-view');
  if(printStatView) printStatView.onclick = printCurrentStatView;
  const exportMissing = document.getElementById('export-missing');
  if(exportMissing) exportMissing.onclick = exportMissingExcel;

async function handleRosterImport(e){
  const file = e.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('roster-import-status');
  statusEl.textContent = 'جاري القراءة...';
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1});
    const newEntries = [];
    for(const row of rows){
      const name = (row[0]||'').toString().trim();
      let id = (row[1]!==undefined && row[1]!==null) ? row[1].toString().trim() : '';
      if(!name || !id || name==='اسم الطالب') continue;
      if(id.endsWith('.0')) id = id.slice(0,-2);
      const classGrade = normalizeClassGrade((row[2]!==undefined && row[2]!==null) ? row[2].toString().trim() : '');
      const section = normalizeSection((row[3]!==undefined && row[3]!==null) ? row[3].toString().trim() : '');
      newEntries.push({name, nationalId:id, classGrade, section});
    }
    const existingIds = new Set(state.roster.map(s=>s.nationalId));
    let added = 0, updated = 0;
    const toInsert = [];
    const toUpdate = [];
    newEntries.forEach(ent=>{
      if(!existingIds.has(ent.nationalId)){
        state.roster.push(ent); existingIds.add(ent.nationalId); added++; toInsert.push(ent);
      } else if(ent.classGrade || ent.section){
        const existing = state.roster.find(s=>s.nationalId===ent.nationalId);
        if(existing && (!existing.classGrade || !existing.section)){
          existing.classGrade = ent.classGrade || existing.classGrade || '';
          existing.section = ent.section || existing.section || '';
          toUpdate.push(existing); updated++;
        }
      }
    });
    localSet('roster', state.roster);
    if(sb && toInsert.length){
      await sb.from('roster').upsert(toInsert.map(s=>({national_id:s.nationalId, name:s.name, class_grade:s.classGrade||null, section:s.section||null})), {onConflict:'national_id'});
    }
    if(sb && toUpdate.length){
      await sb.from('roster').upsert(toUpdate.map(s=>({national_id:s.nationalId, name:s.name, class_grade:s.classGrade||null, section:s.section||null})), {onConflict:'national_id'});
    }
    statusEl.textContent = `تمت إضافة ${added} طالب جديد${updated? ' وتحديث الصف/الشعبة لـ '+updated+' طالب':''} (الإجمالي الآن: ${state.roster.length}).`;
  }catch(err){
    statusEl.textContent = 'تعذر قراءة الملف، تأكد من أن العمود الأول للاسم والثاني لرقم الهوية.';
  }
}

function sortStudents(students, mode){
  const arr = [...students];
  if(mode === 'class'){
    arr.sort((a,b)=>{
      const ca = (a.classGrade||'')+'-'+(a.section||''), cb = (b.classGrade||'')+'-'+(b.section||'');
      const cmp = ca.localeCompare(cb, 'ar');
      return cmp !== 0 ? cmp : a.name.localeCompare(b.name, 'ar');
    });
  } else if(mode === 'condition'){
    arr.sort((a,b)=>{
      const ca = a.conditionsText || '', cb = b.conditionsText || '';
      const cmp = ca.localeCompare(cb, 'ar');
      return cmp !== 0 ? cmp : a.name.localeCompare(b.name, 'ar');
    });
  } else {
    arr.sort((a,b)=> a.name.localeCompare(b.name, 'ar'));
  }
  return arr;
}

        condKeys.forEach(k=>{ const cDef = CONDITIONS.find(c=>c.key===k); labels.push(cDef?cDef.title:k); });
        titleParts.push('الحالة: '+labels.join('، '));
      }
    }
    const title = titleParts.filter(Boolean).length
      ? ('كشف الطلاب — '+titleParts.filter(Boolean).join(' | '))
      : 'جميع الطلاب المسجلين';
    const rows = filtered.map(s=>{
      let conditionsText;
      if(condKeys.length){
        conditionsText = condKeys.filter(k=>s.conditions[k] && s.conditions[k].checked).map(k=>{
          const detail = s.conditions[k].detail;
          const cDef = CONDITIONS.find(c=>c.key===k);
          return (cDef?cDef.title:k) + (detail? (' - '+detail) : '');
        }).join('؛ ') || 'لا يوجد';
      } else {
        conditionsText = conditionsSummaryText(s).replace(/\n/g, '؛ ').replace(/^- /,'').replace(/؛ - /g,'؛ ');
      }
      return {name:s.studentName, nationalId:s.nationalId, classGrade:s.classGrade, section:s.section, conditionsText};
    });
    return { title, rows };
  };

  overlay.querySelector('#advprint-alpha').onclick = ()=>{ const {title,rows}=computeFiltered(); close(); printStudentTable(title, rows, 'alpha'); };

  overlay.querySelector('#advprint-cond-order').onclick = ()=>{ const {title,rows}=computeFiltered(); close(); printStudentTable(title, rows, 'condition'); };

    if(!phone) return;
    const { title, rows } = computeFiltered();
    const sorted = sortStudents(rows, 'alpha');
    const lines = sorted.map((s,i)=> (i+1)+'. '+s.name+' - '+(s.classGrade||'')+' '+(s.section||'')+' - '+s.conditionsText).join('\n');
    const msg = `${title}\nابتدائية هشام بن عبد الملك بالخرج — العام الدراسي ${state.settings.academicYear||''}\nالعدد: ${sorted.length}\n\n${lines}\n\nالموجه الصحي: محمد مشعل العنزي`;
    window.open('https://wa.me/'+normalizePhone(phone)+'?text='+encodeURIComponent(msg), '_blank');
    close();
  };
  const sendDeputy = overlay.querySelector('#advprint-send-deputy');
  if(sendDeputy) sendDeputy.onclick = ()=> sendListVia(state.settings.deputyPrincipalPhone);
  const sendCounselor = overlay.querySelector('#advprint-send-counselor');
  if(sendCounselor) sendCounselor.onclick = ()=> sendListVia(state.settings.studentCounselorPhone);

    const phone = prompt('أدخل رقم جوال المعلم لإرسال القائمة إليه عبر واتساب:');
    if(phone) sendListVia(phone);
  };
}

function btErrText(e){
  const m = (e && (e.message||e.name)) || '';
