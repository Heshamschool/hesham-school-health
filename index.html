  const bySectionClass = (a,b)=>{
    const ca=(a.section||'ززز')+'-'+(a.classGrade||''), cb=(b.section||'ززز')+'-'+(b.classGrade||'');
    const cmp = ca.localeCompare(cb,'ar');
    return cmp!==0? cmp : a.name.localeCompare(b.name,'ar');
  };
  const sortRows = (arr)=>{
    const out = [...arr];
    if(sortMode==='class') out.sort(byClassSection);
    else if(sortMode==='section') out.sort(bySectionClass);
    else out.sort((a,b)=>a.name.localeCompare(b.name,'ar'));
    return out;
  };
  const pinNewFirst = (arr)=>{
    if(!state.newSubmissionIds || !state.newSubmissionIds.length) return arr;
    const newSet = new Set(state.newSubmissionIds);
    const newOnes = arr.filter(r=>newSet.has(r.nationalId));
    const rest = arr.filter(r=>!newSet.has(r.nationalId));
    return [...newOnes, ...rest];
  };
  const newBadgeHtml = (nid)=> (state.newSubmissionIds||[]).includes(nid) ? `<span class="badge" style="background:#0a7c42;color:#fff;">جديد</span>` : '';

  let rowsHtml = '';
  let count = 0;
  if(view === 'all'){
    const list = sortRows(data.roster.filter(s=>matchesQ(s.name, s.nationalId)));
    count = list.length;
    rowsHtml = list.map(s=>`
      <div class="list-row">
        <span>${esc(s.name)} <span style="color:var(--muted);font-size:12px;">(${esc(s.nationalId)})${(s.classGrade||s.section)? ' — '+esc(s.classGrade||'')+' '+esc(s.section||''):''}</span></span>
        <span>
          <button class="icon-btn" data-edit-student="${esc(s.nationalId)}" style="margin-left:8px;">✏️ تعديل</button>
          <button class="icon-btn" data-move-student="${esc(s.nationalId)}" data-move-name="${esc(s.name)}" data-move-grade="${esc(s.classGrade||'')}" data-move-section="${esc(s.section||'')}">نقل الشعبة</button>
          <button class="icon-btn" data-del-roster="${esc(s.nationalId)}" data-del-roster-name="${esc(s.name)}" style="color:var(--danger);margin-right:8px;">حذف</button>
        </span>
      </div>`).join('');
  } else if(view === 'registered'){
    const list = pinNewFirst(sortRows(data.subs.map(s=>({...s, name:s.studentName})).filter(s=>matchesQ(s.name, s.nationalId))));
    count = list.length;
    rowsHtml = list.map(s=>`
      <div class="list-row" data-open-detail="${esc(s.nationalId)}" style="cursor:pointer;">
        <span>${esc(s.studentName)} ${newBadgeHtml(s.nationalId)}</span>
        <span style="color:var(--muted)">${esc(s.classGrade)} - ${esc(s.section)} ‹</span>
      </div>`).join('');
  } else if(view === 'withConditions'){
    const list = sortRows(data.withConditionsList.map(s=>({...s, name:s.studentName})).filter(s=>matchesQ(s.name, s.nationalId)));
    count = list.length;
    rowsHtml = list.map(s=>renderConditionLogCard(s)).join('');
  } else if(view === 'missing'){
    const filteredMissing = data.missing.filter(s=>matchesQ(s.name, s.nationalId));
    count = filteredMissing.length;
    if(sortMode === 'class' || sortMode === 'section'){
      const groups = {};
      sortRows(filteredMissing).forEach(s=>{
        const key = sortMode==='class'
          ? ((s.classGrade||'بدون صف محدد') + (s.section? (' - '+s.section) : ''))
          : ((s.section||'بدون شعبة محددة') + (s.classGrade? (' - '+s.classGrade) : ''));
        if(!groups[key]) groups[key] = [];
        groups[key].push(s);
      });
      rowsHtml = Object.keys(groups).map(key=>`
        <div style="margin:14px 0 6px;padding-top:10px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
          <b style="font-size:13.5px;color:var(--teal-900);">${esc(key)} (${groups[key].length})</b>
          <button class="btn btn-wa" data-wa-remind-class="${esc(key)}" style="width:auto;padding:6px 14px;font-size:12px;">📢 تذكير جماعي واتساب</button>
        </div>
        ${groups[key].map(s=>`
          <div class="list-row">
            <span>${esc(s.name)}</span>
            <span>
              <button class="icon-btn" data-print-single="${esc(s.nationalId)}" data-print-name="${esc(s.name)}">طباعة تنبيه</button>
              <button class="icon-btn" data-wa-remind="${esc(s.nationalId)}" data-wa-remind-name="${esc(s.name)}" style="margin-right:8px;">واتساب</button>
            </span>
          </div>`).join('')}
      `).join('');
    } else {
      rowsHtml = sortRows(filteredMissing).map(s=>`
        <div class="list-row">
          <span>${esc(s.name)}</span>
          <span>
            <button class="icon-btn" data-print-single="${esc(s.nationalId)}" data-print-name="${esc(s.name)}">طباعة تنبيه</button>
            <button class="icon-btn" data-wa-remind="${esc(s.nationalId)}" data-wa-remind-name="${esc(s.name)}" style="margin-right:8px;">واتساب</button>
          </span>
        </div>`).join('');
    }
  }
  const totalCount = view==='all'?data.roster.length : view==='registered'?data.subs.length : view==='withConditions'?data.withConditionsList.length : data.missing.length;
  return `
    <div class="card">
      <h2>${titles[view]} (${count}${statQ && count!==totalCount? ' من '+totalCount : ''})</h2>
      ${['all','registered','withConditions','missing'].includes(view) ? `
        <div class="field" style="margin-bottom:10px;">
          <input type="text" id="stat-search" placeholder="اكتب اسم الطالب أو رقم الهوية للبحث..." value="${esc(state.statSearch)}">
        </div>
        <div class="btn-row" style="margin-bottom:14px;">
          <button class="btn ${sortMode==='alpha'?'':'btn-outline'}" data-stat-sort="alpha" style="flex:1;">ترتيب أبجدي</button>
          <button class="btn ${sortMode==='class'?'':'btn-outline'}" data-stat-sort="class" style="flex:1;">ترتيب حسب الصف</button>
          <button class="btn ${sortMode==='section'?'':'btn-outline'}" data-stat-sort="section" style="flex:1;">ترتيب حسب الشعبة</button>
        </div>
      ` : ''}
      ${view==='all' ? `
        <div class="btn-row" style="margin-bottom:14px;">
          <button class="btn btn-outline" id="open-add-student" style="flex:1;">+ إضافة طالب جديد</button>
        </div>
        ${state.showAddStudent ? renderAddStudentForm() : ''}
      ` : ''}
      ${count===0? `<div class="empty">لا توجد بيانات مطابقة.</div>` : `<div class="cond-list">${rowsHtml}</div>`}
      <div class="btn-row" style="margin-top:14px;">
        <button class="btn btn-outline" id="close-stat-view">إغلاق</button>
        ${count>0 && view!=='withConditions'? `<button class="btn" id="print-stat-view">طباعة القائمة</button>`:''}
        ${view==='missing' && count>0? `<button class="btn btn-outline" id="export-missing">تصدير Excel</button>`:''}
      </div>
    </div>
  `;
}

function renderConditionLogCard(s){
  const active = CONDITIONS.filter(c => c.key!=='none' && s.conditions[c.key] && s.conditions[c.key].checked);
  return `
    <div class="cond-item" style="padding:14px 10px;">
      <div data-open-detail="${esc(s.nationalId)}" style="cursor:pointer;font-weight:900;color:var(--teal-900);margin-bottom:8px;">${esc(s.studentName)} <span style="font-weight:500;color:var(--muted);font-size:12px;">(${esc(s.classGrade)} - ${esc(s.section)})</span> <span style="color:var(--muted);font-size:12px;">‹ عرض التفاصيل الكاملة</span></div>
      ${active.map(c=>{
        const editing = state.editingCond && state.editingCond.id===s.nationalId && state.editingCond.key===c.key;
        return `
        <div class="list-row" style="align-items:flex-start;">
          <div style="flex:1;">
            <b style="font-size:13.5px;">${c.title}</b>
            ${editing ? `
              <textarea id="cond-edit-textarea" style="margin-top:6px;min-height:60px;">${esc(s.conditions[c.key].detail||'')}</textarea>
              <div class="btn-row" style="margin-top:6px;">
                <button class="icon-btn" data-save-cond="${esc(s.nationalId)}:${c.key}">حفظ</button>
                <button class="icon-btn" data-cancel-cond-edit style="color:var(--muted);">إلغاء</button>
              </div>
            ` : (s.conditions[c.key].detail ? `<div style="font-size:12.5px;color:var(--muted);margin-top:3px;">${esc(s.conditions[c.key].detail)}</div>` : '')}
          </div>
          ${!editing ? `
          <div style="display:flex;gap:8px;flex:0 0 auto;">
            <button class="icon-btn" data-edit-cond="${esc(s.nationalId)}:${c.key}">تعديل</button>
            <button class="icon-btn" data-del-cond="${esc(s.nationalId)}:${c.key}" style="color:var(--danger);">حذف</button>
          </div>` : ''}
        </div>`;
      }).join('')}
    </div>
  `;
}

  `;

function toLocalInputValue(iso){
  const d = new Date(iso);
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,16);
}

async function handleImageUpload(e, stateKey, dbColumn){
  const file = e.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('image-upload-status');
  if(statusEl) statusEl.textContent = 'جاري الرفع...';
  try{
    const dataUrl = await new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=> resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    const newSettings = {...state.settings, [stateKey]: dataUrl};
    if(sb){
      const { error } = await sb.from('settings').upsert({ id:1, [dbColumn]: dataUrl });
      if(error) throw error;
    }
    state.settings = newSettings;
    localSet('settings', state.settings);
    if(statusEl) statusEl.textContent = 'تم تحديث الصورة بنجاح ✓';
    render();
  }catch(err){
    if(statusEl) statusEl.textContent = 'تعذر رفع الصورة، حاول بصورة أصغر حجمًا.';
  }
}

async function handleRosterImport(e){
  const file = e.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('roster-import-status');
  statusEl.textContent = 'جاري القراءة...';
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1});
    const newEntries = [];
    for(const row of rows){
      const name = (row[0]||'').toString().trim();
      let id = (row[1]!==undefined && row[1]!==null) ? row[1].toString().trim() : '';
      if(!name || !id || name==='اسم الطالب') continue;
      if(id.endsWith('.0')) id = id.slice(0,-2);
      const classGrade = normalizeClassGrade((row[2]!==undefined && row[2]!==null) ? row[2].toString().trim() : '');
      const section = normalizeSection((row[3]!==undefined && row[3]!==null) ? row[3].toString().trim() : '');
      newEntries.push({name, nationalId:id, classGrade, section});
    }
    const existingIds = new Set(state.roster.map(s=>s.nationalId));
    let added = 0, updated = 0;
    const toInsert = [];
    const toUpdate = [];
    newEntries.forEach(ent=>{
      if(!existingIds.has(ent.nationalId)){
        state.roster.push(ent); existingIds.add(ent.nationalId); added++; toInsert.push(ent);
      } else if(ent.classGrade || ent.section){
        const existing = state.roster.find(s=>s.nationalId===ent.nationalId);
        if(existing && (!existing.classGrade || !existing.section)){
          existing.classGrade = ent.classGrade || existing.classGrade || '';
          existing.section = ent.section || existing.section || '';
          toUpdate.push(existing); updated++;
        }
      }
    });
    localSet('roster', state.roster);
    if(sb && toInsert.length){
      await sb.from('roster').upsert(toInsert.map(s=>({national_id:s.nationalId, name:s.name, class_grade:s.classGrade||null, section:s.section||null})), {onConflict:'national_id'});
    }
    if(sb && toUpdate.length){
      await sb.from('roster').upsert(toUpdate.map(s=>({national_id:s.nationalId, name:s.name, class_grade:s.classGrade||null, section:s.section||null})), {onConflict:'national_id'});
    }
    statusEl.textContent = `تمت إضافة ${added} طالب جديد${updated? ' وتحديث الصف/الشعبة لـ '+updated+' طالب':''} (الإجمالي الآن: ${state.roster.length}).`;
  }catch(err){
    statusEl.textContent = 'تعذر قراءة الملف، تأكد من أن العمود الأول للاسم والثاني لرقم الهوية.';
  }
}

function sortStudents(students, mode){
  const arr = [...students];
  if(mode === 'class'){
    arr.sort((a,b)=>{
      const ca = (a.classGrade||'')+'-'+(a.section||''), cb = (b.classGrade||'')+'-'+(b.section||'');
      const cmp = ca.localeCompare(cb, 'ar');
      return cmp !== 0 ? cmp : a.name.localeCompare(b.name, 'ar');
    });
  } else if(mode === 'condition'){
    arr.sort((a,b)=>{
      const ca = a.conditionsText || '', cb = b.conditionsText || '';
      const cmp = ca.localeCompare(cb, 'ar');
      return cmp !== 0 ? cmp : a.name.localeCompare(b.name, 'ar');
    });
  } else {
    arr.sort((a,b)=> a.name.localeCompare(b.name, 'ar'));
  }
  return arr;
}

  const area = document.getElementById('print-area');
  if(!area) return;
  const sorted = sortStudents(students, mode);
  const modeLabels = { class:'مرتبة حسب الصف والشعبة', condition:'مرتبة حسب الحالة الصحية', alpha:'مرتبة أبجديًا حسب الاسم' };
  const modeLabel = modeLabels[mode] || modeLabels.alpha;
  const hasConditionCol = sorted.some(s => s.conditionsText !== undefined);

    <div class="print-sub">العام الدراسي ${esc(state.settings.academicYear||'')} — ${modeLabel} — العدد: ${sorted.length}</div>

      <thead><tr><th>اسم الطالب</th><th>رقم الهوية</th><th>الصف</th><th>الشعبة</th>${hasConditionCol? '<th>الحالة الصحية</th>':''}</tr></thead>
      <tbody>

function printByClassSection(){
  const subs = state.submissions || [];
  const groups = {};
  subs.forEach(s=>{
    const key = (s.classGrade||'—') + ' - ' + (s.section||'—');
    if(!groups[key]) groups[key] = [];
    groups[key].push(s);
  });
  const area = document.getElementById('print-area');
  if(!area) return;
  let bodyHtml = '';
  Object.keys(groups).sort((a,b)=>a.localeCompare(b,'ar')).forEach(key=>{
    const rows = sortStudents(groups[key].map(s=>({name:s.studentName, nationalId:s.nationalId, classGrade:s.classGrade, section:s.section, hasCond: countConditions(s)>0})), 'alpha');
    bodyHtml += `
      <div class="print-group-title">${esc(key)} (${rows.length})</div>
      <table class="print-table">
        <thead><tr><th>اسم الطالب</th><th>رقم الهوية</th><th>الحالة الصحية</th></tr></thead>
        <tbody>
          ${rows.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.nationalId||'')}</td><td>${s.hasCond? 'يوجد':'لا يوجد'}</td></tr>`).join('')}
        </tbody>
      </table>
    `;
  });

    <div class="print-header">ابتدائية هشام بن عبد الملك بالخرج<br>كشف الطلاب حسب الصف والشعبة</div>

}

      if(sec && s.section !== sec) return false;
      if(checkedBoxes.length){
        const hasNone = countConditions(s) === 0;
        const hasAnySelected = condKeys.some(k => s.conditions[k] && s.conditions[k].checked);

        const matchCond = condKeys.length>0 && hasAnySelected;
        if(!matchNone && !matchCond) return false;

      if(!noneSelected && condKeys.length === allCondCount){
        titleParts.push('الحالة: جميع الحالات');

  };

  if(sendDeputy) sendDeputy.onclick = ()=> sendListVia(state.settings.deputyPrincipalPhone);
  const sendCounselor = overlay.querySelector('#advprint-send-counselor');
  if(sendCounselor) sendCounselor.onclick = ()=> sendListVia(state.settings.studentCounselorPhone);
  overlay.querySelector('#advprint-send-teacher').onclick = ()=>{
    const phone = prompt('أدخل رقم جوال المعلم لإرسال القائمة إليه عبر واتساب:');
    if(phone) sendListVia(phone);
  };
}

function btSupportHint(){

}
function btErrText(e){
  const m = (e && (e.message||e.name)) || '';

  if(m==='no-char') return 'لم يتم العثور على قناة طباعة في هذه الطابعة (قد تكون Classic وليست BLE).';

async function btOpenChar(){
  const server = await bt.device.gatt.connect();
  const services = await server.getPrimaryServices();
  for(const sv of services){
    const chars = await sv.getCharacteristics();
    for(const c of chars){
      if(c.properties.writeWithoutResponse || c.properties.write){ bt.char = c; return; }
    }
  }
  throw new Error('no-char');
}
async function btConnect(){
  if(!navigator.bluetooth) throw new Error('unsupported');
  const device = await navigator.bluetooth.requestDevice({ acceptAllDevices:true, optionalServices: BT_SERVICES });
  bt.device = device; bt.name = device.name || 'طابعة'; bt.char = null;
  device.addEventListener('gattserverdisconnected', ()=>{ bt.char = null; const el = document.getElementById('bt-status'); if(el) el.textContent = btStatusText(); });
  await btOpenChar();
}
function btDisconnect(){
  try{ if(bt.device && bt.device.gatt.connected) bt.device.gatt.disconnect(); }catch(e){}
  bt.device = null; bt.char = null; bt.name = '';
}
async function btWrite(bytes){
  const ch = bt.char;
  const hasNoResp = !!ch.properties.writeWithoutResponse;
  const send = async (chunk)=>{
    if(hasNoResp){
      if(ch.writeValueWithoutResponse) await ch.writeValueWithoutResponse(chunk); else await ch.writeValue(chunk);
      await new Promise(r=>setTimeout(r, 10));
    } else {
      if(ch.writeValueWithResponse) await ch.writeValueWithResponse(chunk); else await ch.writeValue(chunk);
    }
  };
  for(let attempt=0; attempt<2; attempt++){
    try{
      for(let i=0; i<bytes.length; i+=bt.chunk){ await send(bytes.slice(i, i+bt.chunk)); }
      return;
    }catch(e){
      if(attempt===0 && bt.chunk>20){ bt.chunk = 20; continue; }
      throw e;
    }
  }
}
function btCollectRows(area){
  const rows = [];
  const txt = (el)=> (el.innerText||el.textContent||'').replace(/\s+/g,' ').trim();
  const push = (text, o)=>{ text=(text||'').replace(/\s+/g,' ').trim(); if(text) rows.push(Object.assign({text}, o||{})); };
  const walkTable = (tbl)=>{
    tbl.querySelectorAll('tr').forEach(tr=>{
      const cells = [...tr.children].map(txt);
      if(!cells.length) return;
      if(cells.length===2 && tr.children[0].tagName==='TD') push(cells[0]+': '+cells[1], {size:22});
      else push(cells.join(' - '), {size:21, bold: tr.children[0].tagName==='TH'});
    });
    rows.push({rule:true});
  };
  [...area.children].forEach(n=>{
    const cl = n.classList;
    if(cl.contains('print-header')){
      n.innerHTML.split(/<br\s*\/?>/i).forEach((t,i)=>{ const d=document.createElement('div'); d.innerHTML=t; push(d.textContent, {size: i?26:24, bold:true, align:'center'}); });
      rows.push({rule:true});
    } else if(cl.contains('slip-thermal')){
      [...n.children].forEach(c=>{
        const k = c.className;
        if(k==='st-gap') rows.push({gap: 44});
        else if(k==='st-gap b') rows.push({gap: 70});
        else if(k==='st-logo') rows.push({logo:true, h:190});
        else if(k==='st-school') push(txt(c), {size:26, bold:true, align:'center'});
        else if(k==='st-title'){ rows.push({rule:true}); push(txt(c), {size:30, bold:true, align:'center'}); rows.push({rule:true}); }
        else if(k==='st-f'){ push(txt(c.querySelector('span')), {size:22, align:'center'}); push(txt(c.querySelector('b')), {size:30, bold:true, align:'center'}); }
        else if(k==='st-cnt'){ rows.push({rule:true}); push(txt(c), {size:24, bold:true, align:'center'}); rows.push({rule:true}); }
        else if(k==='st-msg'){ rows.push({gap:6}); push(txt(c), {size:24, bold:true, align:'center'}); }
        else if(k==='st-foot'){ rows.push({rule:true}); c.innerHTML.split(/<br\s*\/?>/i).forEach(t=>push(t, {size:25, bold:true, align:'center'})); }
      });
    } else if(cl.contains('print-sub')){ push(txt(n), {size:20, align:'center'}); }
    else if(cl.contains('report-block')){
      [...n.children].forEach(c=>{
        if(c.classList.contains('r-title')){ push(txt(c), {size:25, bold:true, align:'center'}); }
        else if(c.classList.contains('r-row')){ const sp=c.querySelector('span'), b=c.querySelector('b'); push((sp?txt(sp):'')+': '+(b?txt(b):''), {size:22}); }
        else if(c.tagName==='TABLE'){ walkTable(c); }
        else push(txt(c), {size:22});
      });
      rows.push({rule:true});
    }
    else if(n.tagName==='TABLE'){ walkTable(n); }
    else if(cl.contains('sig-row')){ rows.push({gap:30}); push('توقيع: ______________', {size:20}); rows.push({gap:14}); }
    else if(cl.contains('print-footer')){ push(txt(n), {size:19, align:'center'}); }
    else { push(txt(n), {size:22, bold:true, align:'center'}); }
  });
  return rows;
}
async function btRasterBytes(rows, width){
  const fam = "Tajawal, Tahoma, 'Segoe UI', Arial, sans-serif", pad = 8;
  try{ await document.fonts.load('bold 22px Tajawal'); await document.fonts.load('22px Tajawal'); }catch(e){}
  let logoImg = null;
  if(rows.some(r=>r.logo)){
    logoImg = await new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=CLINIC_LOGO; });
  }
  const mc = document.createElement('canvas').getContext('2d');
  mc.direction = 'rtl';
  const lines = [];
  rows.forEach(r=>{
    if(r.rule){ lines.push({rule:true, h:12}); return; }
    if(r.gap){ lines.push({gap:true, h:r.gap}); return; }
    if(r.logo){ if(logoImg) lines.push({logo:true, h:r.h}); return; }
    const size = r.size||22; mc.font = (r.bold?'bold ':'')+size+'px '+fam;
    const words = r.text.split(' '); let cur='';
    const flush = ()=>{ if(cur) lines.push({t:cur, size, bold:!!r.bold, align:r.align||'right', h:Math.round(size*1.5)}); cur=''; };
    words.forEach(w=>{
      const test = cur? cur+' '+w : w;
      if(cur && mc.measureText(test).width > width-2*pad) { flush(); cur=w; } else cur=test;
    });
    flush();
  });
  const height = Math.max(40, lines.reduce((a,l)=>a+l.h,0) + pad*2 + 16);
  const cv = document.createElement('canvas'); cv.width = width; cv.height = height;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,width,height);
  ctx.fillStyle = '#000'; ctx.textBaseline = 'top'; ctx.direction = 'rtl';
  let y = pad;
  lines.forEach(l=>{
    if(l.logo){ ctx.drawImage(logoImg, (width-(l.h-6))/2, y+3, l.h-6, l.h-6); }
    else if(l.rule){ ctx.fillRect(pad, y+5, width-2*pad, 2); }
    else if(!l.gap && !l.logo){
      ctx.font = (l.bold?'bold ':'')+l.size+'px '+fam;
      if(l.align==='center'){ ctx.textAlign='center'; ctx.fillText(l.t, width/2, y+2); }
      else { ctx.textAlign='right'; ctx.fillText(l.t, width-pad, y+2); }
    }
    y += l.h;
  });
  const img = ctx.getImageData(0,0,width,height).data;
  const bpr = width/8, out = [0x1B,0x40];
  for(let y0=0; y0<height; y0+=200){
    const h = Math.min(200, height-y0);
    out.push(0x1D,0x76,0x30,0x00, bpr&255, bpr>>8, h&255, h>>8);
    for(let yy=y0; yy<y0+h; yy++){
      for(let bx=0; bx<bpr; bx++){
        let byte = 0;
        for(let bit=0; bit<8; bit++){
          const x = bx*8+bit, p = (yy*width+x)*4;
          const lum = 0.299*img[p] + 0.587*img[p+1] + 0.114*img[p+2];
          if(lum < 150) byte |= (0x80>>bit);
        }
        out.push(byte);
      }
    }
  }
  out.push(0x1B,0x64,0x04);
  return new Uint8Array(out);
}
async function btSendRows(rows){

}

const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
function toAr(v){ return (v===null||v===undefined?'':String(v)).replace(/\d/g, d=>AR_DIGITS[d]); }
function hijriDateStr(dateStr){
  try{
    const d = dateStr ? new Date(dateStr+'T12:00:00') : new Date();
    const out = d.toLocaleDateString('ar-SA-u-ca-islamic-umalqura-nu-arab', {day:'numeric', month:'long', year:'numeric'});
    return out.replace(/\s*هـ\s*$/,'') + ' هـ';
  }catch(e){ return toAr(dateStr||''); }
}
function timeArStr(t){
  if(!t) return '';
  try{ const [h,m] = t.split(':'); const d = new Date(); d.setHours(+h, +m, 0, 0); return d.toLocaleTimeString('ar-SA-u-nu-arab', {hour:'numeric', minute:'2-digit', hour12:true}); }
  catch(e){ return toAr(t); }
}

function runPrint(mode, fn){
  // mode: 'thermal' | 'standard'
  let thermalPageStyle = document.getElementById('thermal-page-style');
  if(mode === 'thermal'){
    document.body.classList.add('printing-thermal');
    if(!thermalPageStyle){
      thermalPageStyle = document.createElement('style');
      thermalPageStyle.id = 'thermal-page-style';
      thermalPageStyle.textContent = '@page{margin:1mm;size:50mm auto;}';
      document.head.appendChild(thermalPageStyle);
    }
  } else {
    document.body.classList.remove('printing-thermal');
    if(thermalPageStyle) thermalPageStyle.remove();
  }
  fn();
  const cleanup = ()=>{
    document.body.classList.remove('printing-thermal');
    const st = document.getElementById('thermal-page-style');
    if(st) st.remove();
    window.removeEventListener('afterprint', cleanup);
  };
  if(mode === 'thermal' && bt.use && bt.device){
    btPrintArea().then(cleanup).catch(err=>{
      cleanup();
      alert('تعذرت الطباعة عبر البلوتوث: '+btErrText(err)+'\nسيتم فتح نافذة الطباعة العادية.');
      document.body.classList.add('printing-thermal');
      window.print();
      window.addEventListener('afterprint', cleanup);
      setTimeout(cleanup, 4000);
    });
    return;
  }
  window.print();
  window.addEventListener('afterprint', cleanup);
  setTimeout(cleanup, 4000);
}

function absenceReportsWithStudentInfo(){

    const s = byId[r.nationalId];
    return {
      ...r,
      classGrade: s? s.classGrade : '',
      section: s? s.section : '',
      conditionsText: s? conditionsSummaryText(s).replace(/\n/g, '؛ ').replace(/^- /,'').replace(/؛ - /g,'؛ ') : '',

    };
  });

function thisWeekRange(){
  // الأسبوع الدراسي: الأحد إلى الخميس
  const now = new Date();
  const dow = now.getDay(); // 0=Sunday
  const sunday = new Date(now); sunday.setDate(now.getDate() - dow); sunday.setHours(0,0,0,0);
  const thursday = new Date(sunday); thursday.setDate(sunday.getDate() + 4); thursday.setHours(0,0,0,0);
  const toStr = d => d.toISOString().slice(0,10);
  return { from: toStr(sunday), to: toStr(thursday) };
}

    } else if(periodMode === 'custom'){
      fromDate = overlay.querySelector('#absreport-from').value || null;
      toDate = overlay.querySelector('#absreport-to').value || null;
      if(fromDate || toDate) periodLabel = 'من '+(fromDate||'البداية')+' إلى '+(toDate||'الآن');
    } else if(periodMode === 'day'){
      const day = overlay.querySelector('#absreport-day').value;
      if(day){ fromDate = day; toDate = day; periodLabel = 'يوم '+day; }
    }
    const cls = overlay.querySelector('#absreport-class').value;
    const studentQ = overlay.querySelector('#absreport-student').value.trim();

    let rows = withInfo.filter(r=>{
      if(fromDate && r.absenceDate < fromDate) return false;
      if(toDate && r.absenceDate > toDate) return false;
      if(cls && r.classGrade !== cls) return false;
      if(studentQ && !nameMatchesQuery(r.studentName, studentQ)) return false;
      return true;
    });

    const titleParts = [periodLabel];
    if(cls) titleParts.push('الصف: '+cls);
    if(studentQ) titleParts.push('الطالب: '+studentQ);
    const title = 'تقرير الغياب — '+titleParts.join(' | ');

    // group by student
    const byStudent = {};
    rows.forEach(r=>{
      const key = r.nationalId || r.studentName;
      if(!byStudent[key]) byStudent[key] = { studentName:r.studentName, classGrade:r.classGrade, section:r.section, count:0, dates:[] };
      byStudent[key].count++;
      byStudent[key].dates.push(r.absenceDate);
    });
    const studentRows = Object.values(byStudent).sort((a,b)=> b.count - a.count || a.studentName.localeCompare(b.studentName,'ar'));

    lastResult = { title, rows: studentRows, totalAbsenceEntries: rows.length, totalStudents: studentRows.length, isSingleStudent: !!studentQ };

    const resultsEl = overlay.querySelector('#absreport-results');
    resultsEl.innerHTML = `
      <div style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <b style="font-size:13px;color:var(--teal-900);">${esc(periodLabel)}</b>
          <button class="btn btn-outline" id="absreport-print" style="width:auto;padding:7px 16px;font-size:12px;">🖨️ طباعة</button>
        </div>
        <div class="btn-row" style="margin-bottom:10px;">
          <div class="stat" style="flex:1;"><b>${rows.length}</b><span>إجمالي أيام الغياب</span></div>
          <div class="stat" style="flex:1;"><b>${studentRows.length}</b><span>عدد الطلاب الغائبين</span></div>
        </div>
        ${studentRows.length===0? `<div class="empty">لا توجد بلاغات غياب مطابقة.</div>` : `
        <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:12.5px;">
          <thead><tr style="text-align:right;color:var(--muted);font-size:10.5px;">
            <th style="padding:6px;">اسم الطالب</th><th style="padding:6px;">الصف</th><th style="padding:6px;">الشعبة</th><th style="padding:6px;">عدد مرات الغياب</th>${studentQ? '<th style="padding:6px;">التواريخ</th>':''}
          </tr></thead>
          <tbody>
            ${studentRows.map(s=>`<tr style="border-top:1px solid var(--line);">
              <td style="padding:6px;">${esc(s.studentName)}</td>
              <td style="padding:6px;">${esc(s.classGrade||'')}</td>
              <td style="padding:6px;">${esc(s.section||'')}</td>
              <td style="padding:6px;"><span style="background:#fbe9e3;color:var(--danger);font-weight:900;padding:2px 10px;border-radius:20px;">${s.count}</span></td>
              ${studentQ? `<td style="padding:6px;font-size:11px;">${s.dates.join('، ')}</td>`:''}
            </tr>`).join('')}
          </tbody>
        </table>
        </div>`}
      </div>
    `;
    const printBtn = resultsEl.querySelector('#absreport-print');
    if(printBtn) printBtn.onclick = ()=>{ if(lastResult) printAbsenceReportSummary(lastResult); };
  };

  // تشغيل تلقائي لعرض تقرير هذا الأسبوع عند الفتح
  overlay.querySelector('#absreport-run').click();
}

function printAbsenceReportSummary(result){
  const area = document.getElementById('print-area');
  if(!area) return;
  area.innerHTML = `
    <div class="print-header">ابتدائية هشام بن عبد الملك بالخرج<br>${esc(result.title)}</div>
    <div class="print-sub">العام الدراسي ${esc(state.settings.academicYear||'')} — إجمالي أيام الغياب: ${result.totalAbsenceEntries} — عدد الطلاب: ${result.totalStudents}</div>
    <table class="print-table">
      <thead><tr><th>اسم الطالب</th><th>الصف</th><th>الشعبة</th><th>عدد مرات الغياب</th>${result.isSingleStudent? '<th>التواريخ</th>':''}</tr></thead>
      <tbody>
        ${result.rows.map(s=>`<tr><td>${esc(s.studentName)}</td><td>${esc(s.classGrade||'')}</td><td>${esc(s.section||'')}</td><td>${s.count}</td>${result.isSingleStudent? `<td>${esc(s.dates.join('، '))}</td>`:''}</tr>`).join('')}
      </tbody>
    </table>
    <div class="print-footer">الموجه الصحي: محمد مشعل العنزي</div>
  `;
  window.print();
}

/* ---------- HELPERS ---------- */
function withFocusPreserved(renderFn){
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;
  const restore = ()=>{
    if(!activeId) return;
    const el = document.getElementById(activeId);
    if(el && el.focus){
      el.focus();
      if(selStart!==null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  };
  const result = renderFn();
  if(result && typeof result.then === 'function') result.then(restore);
  else restore();
  return result;
}
function normalizePhone(p){
  let d = (p||'').replace(/\D/g,'');
  if(d.startsWith('0')) d = '966' + d.slice(1);
  else if(!d.startsWith('966')) d = '966' + d;
  return d;
}
function esc(s){
  return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
