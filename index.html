<style>

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Tajawal',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;}
  .app{max-width:820px;margin:0 auto;padding:22px 16px 60px;}

  .topbar h1{font-size:18px;margin:0 0 4px;font-weight:900;}
  .topbar p{font-size:12.5px;margin:0;color:#bcd6d6;font-weight:500;}
  .section-title{text-align:center;color:var(--teal-900);font-size:16px;font-weight:900;margin:4px 0 16px;}
  .bottom-link{text-align:center;margin-top:22px;}
  .bottom-link a{color:var(--teal-700);font-size:13px;font-weight:700;cursor:pointer;text-decoration:underline;}
  .footnote.credit{margin-top:6px;color:#9aa8a8;}

  .countdown-banner{

    background:var(--teal-100);color:var(--teal-900);
  }
  .countdown-banner.urgent{background:#fbe9e3;color:var(--danger);}
  .countdown-banner.closed{background:#eee;color:var(--muted);}
  .countdown-time{font-size:16px;font-weight:900;letter-spacing:.5px;}

  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;}
  .card h2{font-size:16px;margin:0 0 14px;color:var(--teal-900);font-weight:900;border-bottom:2px solid var(--teal-100);padding-bottom:10px;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:560px){.grid2{grid-template-columns:1fr;}}

  label{display:block;font-size:13px;font-weight:700;color:var(--teal-900);margin-bottom:5px;}
  .field{margin-bottom:14px;}
  .hint{font-size:11.5px;color:var(--muted);margin-top:4px;}
  input[type=text],input[type=tel],input[type=datetime-local],textarea,select{
    width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;font-family:inherit;font-size:14px;color:var(--ink);background:#fff;
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--teal-500);}
  textarea{resize:vertical;min-height:60px;}

  .cond-list{display:flex;flex-direction:column;}
  .cond-item{border-bottom:1px solid var(--line);padding:12px 4px;}
  .cond-item:last-child{border-bottom:none;}
  .cond-head{display:flex;align-items:flex-start;gap:10px;cursor:pointer;}
  .cond-head input[type=checkbox]{width:20px;height:20px;flex:0 0 20px;margin-top:1px;accent-color:var(--teal-700);cursor:pointer;}
  .cond-title{font-weight:700;font-size:14.5px;}
  .cond-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .cond-detail{margin-top:8px;margin-right:30px;display:none;}

  .confirm-box{display:flex;align-items:flex-start;gap:10px;background:var(--teal-100);border-radius:10px;padding:14px;margin-top:6px;}
  .confirm-box input{width:20px;height:20px;flex:0 0 20px;margin-top:2px;accent-color:var(--teal-700);}
  .confirm-box span{font-size:13.5px;line-height:1.6;}

  .btn{display:inline-block;width:100%;padding:13px;border-radius:10px;border:none;background:var(--teal-700);color:#fff;font-family:inherit;font-weight:900;font-size:15px;cursor:pointer;}
  .btn:hover{background:var(--teal-900);}
  .btn:disabled{background:#a9bcbc;cursor:not-allowed;}
  .btn-outline{background:#fff;color:var(--teal-700);border:1.5px solid var(--teal-700);}
  .btn-outline:hover{background:var(--teal-100);}
  .btn-wa{background:#25D366;}
  .btn-wa:hover{background:#1ea952;}
  .btn-row{display:flex;gap:10px;}
  .btn-row .btn{width:auto;flex:1;}

  .err{color:var(--danger);font-size:12.5px;margin-top:4px;display:none;}
  .err.show{display:block;}
  .warn-box{background:#fff6ea;border:1px solid #f0d9a8;color:var(--warn);border-radius:10px;padding:14px;font-size:13.5px;line-height:1.7;margin-bottom:14px;}

  .pin-input{width:100%;text-align:center;letter-spacing:8px;font-size:22px;font-weight:900;padding:12px;border-radius:10px;border:1.5px solid var(--line);margin:14px 0 8px;}

  .dash-toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .dash-toolbar input{flex:1;min-width:160px;}
  .dash-toolbar .btn{width:auto;padding:10px 16px;font-size:13.5px;}

  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}

  .stat{background:var(--teal-100);border-radius:10px;padding:10px;text-align:center;}
  .stat.missing{background:#fbe9e3;}
  .stat b{display:block;font-size:20px;color:var(--teal-900);}
  .stat.missing b{color:var(--danger);}
  .stat span{font-size:10.5px;color:var(--muted);font-weight:700;}

  .sub-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;}

  .sub-card-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .sub-name{font-weight:900;font-size:15px;color:var(--teal-900);}
  .sub-meta{font-size:12px;color:var(--muted);margin-top:3px;}
  .badge{background:var(--gold);color:#fff;font-size:11px;font-weight:700;border-radius:20px;padding:3px 10px;white-space:nowrap;}
  .badge.none{background:#8fa8a8;}
  .badge.edited{background:var(--warn);}
  .badge-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
  .chev{color:var(--muted);font-size:13px;}

  .empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px;}

  .ac-item{padding:9px 12px;font-size:13.5px;cursor:pointer;border-bottom:1px solid #f0f0f0;}

  .setup-screen p{color:var(--muted);font-size:13.5px;line-height:1.8;margin-bottom:6px;}
  .setup-screen code{background:var(--teal-100);color:var(--teal-900);padding:2px 6px;border-radius:5px;font-size:12.5px;direction:ltr;display:inline-block;}

   من: Supabase Dashboard → Settings → API

const SUPABASE_ANON_KEY = 'sb_publishable_37p0wHFHCfBN5RPFP5Uu2A_ZPTfpq5Z';
/* ============================================================ */

const SETUP_NEEDED = SUPABASE_URL.indexOf('YOUR_SUPABASE') === 0 || SUPABASE_ANON_KEY.indexOf('YOUR_SUPABASE') === 0;
let sb = null;
if(!SETUP_NEEDED){
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

const LOCAL_PREFIX = 'hesham_health_';
function localGet(key){ try{ const v = localStorage.getItem(LOCAL_PREFIX+key); return v? JSON.parse(v): null; }catch(e){ return null; } }
function localSet(key, val){ try{ localStorage.setItem(LOCAL_PREFIX+key, JSON.stringify(val)); }catch(e){} }

function rowToRecord(row){
  return {
    nationalId: row.national_id,
    studentName: row.student_name,
    classGrade: row.class_grade,
    section: row.section,
    parentMobile: row.parent_mobile,
    altMobile: row.alt_mobile || '',
    conditions: row.conditions || {},
    notes: row.notes || '',
    submittedAt: row.submitted_at,
    updatedAt: row.updated_at,
    editCount: row.edit_count || 0,
  };
}
function recordToRow(rec){
  return {
    national_id: rec.nationalId,
    student_name: rec.studentName,
    class_grade: rec.classGrade,
    section: rec.section,
    parent_mobile: rec.parentMobile,
    alt_mobile: rec.altMobile,
    conditions: rec.conditions,
    notes: rec.notes,
    submitted_at: rec.submittedAt,
    updated_at: rec.updatedAt,
    edit_count: rec.editCount,
  };
}

async function fetchSubmission(nationalId){
  if(!sb){ return localGet('sub_'+nationalId); }
  try{
    const { data, error } = await sb.from('submissions').select('*').eq('national_id', nationalId).maybeSingle();
    if(error) throw error;
    const rec = data ? rowToRecord(data) : null;
    if(rec) localSet('sub_'+nationalId, rec);
    return rec;
  }catch(e){
    return localGet('sub_'+nationalId);
  }
}

async function saveSubmission(record){
  localSet('sub_'+record.nationalId, record);
  if(!sb) return true;
  const { error } = await sb.from('submissions').upsert(recordToRow(record), {onConflict:'national_id'});
  if(error) throw error;
  return true;
}

/* ---------- INIT / STORAGE ---------- */
async function ensureRoster(){
  if(state.roster) return state.roster;
  if(!sb){
    state.roster = localGet('roster') || ROSTER_SEED.map(s=>({name:s.n, nationalId:s.i}));
    return state.roster;
  }
  try{
    const { data, error } = await sb.from('roster').select('national_id,name');
    if(error) throw error;
    if(data && data.length > 0){
      state.roster = data.map(r=>({name:r.name, nationalId:r.national_id}));
    } else {
      const seed = ROSTER_SEED.map(s=>({name:s.n, nationalId:s.i}));
      const rows = seed.map(s=>({national_id:s.nationalId, name:s.name}));
      await sb.from('roster').upsert(rows, {onConflict:'national_id'});
      state.roster = seed;
    }
    localSet('roster', state.roster);
  }catch(e){
    state.roster = localGet('roster') || ROSTER_SEED.map(s=>({name:s.n, nationalId:s.i}));
  }
  return state.roster;
}

async function ensureSettings(){
  if(state.settings) return state.settings;
  const fallbackDefault = () => { const d = new Date(); d.setDate(d.getDate()+DEFAULT_DEADLINE_DAYS); return { pin:'1234', deadline: d.toISOString() }; };
  if(!sb){
    state.settings = localGet('settings') || fallbackDefault();
    return state.settings;
  }
  try{
    const { data, error } = await sb.from('settings').select('*').eq('id',1).maybeSingle();
    if(error) throw error;
    if(data){
      state.settings = { pin: data.pin, deadline: data.deadline };
    } else {
      const def = fallbackDefault();
      await sb.from('settings').insert({ id:1, pin: def.pin, deadline: def.deadline });
      state.settings = def;
    }
    localSet('settings', state.settings);
  }catch(e){
    state.settings = localGet('settings') || fallbackDefault();
  }
  return state.settings;
}

  if(SETUP_NEEDED){

        <p>افتح ملف <code>index.html</code> وعدّل السطرين:<br><code>SUPABASE_URL</code> و <code>SUPABASE_ANON_KEY</code><br>بمعلومات مشروعك من Supabase → Settings → API.</p>
      </div>`;

      ${state.tab==='form'
        ? `<a id="go-dash">لوحة الموجه الصحي</a>`

    </div>
    <p class="footnote credit">هذا النموذج من إعداد وبرمجة الموجه الصحي / محمد مشعل العنزي</p>
  `;
  const goDash = document.getElementById('go-dash');
  if(goDash) goDash.onclick = ()=>switchTab('dash');
  const goForm = document.getElementById('go-form');
  if(goForm) goForm.onclick = ()=>switchTab('form');

  const content = document.getElementById('content');
  if(state.tab === 'form'){
    if(state.formStep === 'select') { content.innerHTML = renderSelect(); bindSelectEvents(); }
    else if(state.formStep === 'fill') { content.innerHTML = renderForm(); bindFormEvents(); }
    else { content.innerHTML = renderSuccess(); bindSuccessEvents(); }
  } else {
    if(!state.dashUnlocked){ content.innerHTML = renderPinGate(); bindPinEvents(); }
    else {
      content.innerHTML = renderDashboard();
      bindDashboardExtras();
    }
  }
}

function switchTab(t){
  state.tab = t; state.activeDetail=null;
  render();
  if(t==='dash' && state.dashUnlocked && state.submissions===null) loadSubmissions();
}

/* ---------- COUNTDOWN ---------- */
let countdownTimer = null;
function renderCountdown(){
  const deadline = state.settings ? new Date(state.settings.deadline) : null;
  if(!deadline) return '';
  const diff = deadline - new Date();
  if(diff <= 0){
    return `<div class="countdown-banner closed">⏱️ انتهت المهلة المحددة لتسجيل بيانات المرحلة الأولى — لا يزال بإمكانكم التسجيل، لكن يرجى الإسراع</div>`;
  }
  const days = Math.floor(diff/86400000);
  const hours = Math.floor((diff%86400000)/3600000);
  const mins = Math.floor((diff%3600000)/60000);
  const secs = Math.floor((diff%60000)/1000);
  const urgent = diff < 3*86400000;
  return `
    <div class="countdown-banner ${urgent?'urgent':''}" id="countdown-box">
      <span>⏱️ الوقت المتبقي لإغلاق تسجيل المرحلة الأولى</span>
      <span class="countdown-time" id="countdown-time">${days} يوم ${pad(hours)}:${pad(mins)}:${pad(secs)}</span>
    </div>`;
}
function pad(n){ return n.toString().padStart(2,'0'); }
function startCountdownTicker(){
  if(countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(()=>{
    const box = document.getElementById('countdown-time');
    if(!box || !state.settings) return;
    const diff = new Date(state.settings.deadline) - new Date();
    if(diff<=0){ render(); return; }
    const days = Math.floor(diff/86400000);
    const hours = Math.floor((diff%86400000)/3600000);
    const mins = Math.floor((diff%3600000)/60000);
    const secs = Math.floor((diff%60000)/1000);
    box.textContent = `${days} يوم ${pad(hours)}:${pad(mins)}:${pad(secs)}`;
  }, 1000);
}

  const nameSelect = document.getElementById('sel-name');
  nameSelect.onchange = e => { state.selName = e.target.value; };

  document.getElementById('sel-id').oninput = e => state.selId = e.target.value;

  document.getElementById('sel-continue').onclick = async ()=>{
    const name = state.selName.trim();
    const id = state.selId.trim();
    if(!name || !id){ state.selErr = 'يرجى إدخال اسم الطالب والرقم السري.'; render(); return; }
    const match = state.roster.find(s => s.name === name);
    if(!match){ state.selErr = 'لم يتم العثور على هذا الاسم ضمن كشف الطلاب، يرجى اختيار الاسم من القائمة المنسدلة.'; render(); return; }
    if(match.nationalId !== id){ state.selErr = 'الرقم السري غير مطابق لهذا الطالب.'; render(); return; }
    state.selErr = null;

    // check existing submission
    let existing = await fetchSubmission(id);

    if(existing && !state.editMode){
      state.existingRecord = existing;
      state.selErr = null;
      render();
      showAlreadyRegisteredModal();
      return;
    }

    // proceed to fill form (new or confirmed edit)
    if(existing){
      state.formData = recordToFormData(existing);
      state.editMode = true;
    } else {
      state.formData = emptyForm();
      state.editMode = false;
    }
    state.formStep = 'fill';
    render();
  };
}

function recordToFormData(rec){
  const conditions = {};
  CONDITIONS.forEach(c => conditions[c.key] = rec.conditions[c.key] ? {...rec.conditions[c.key]} : {checked:false, detail:''});
  return {
    classGrade: rec.classGrade||'', section: rec.section||'',
    parentMobile: rec.parentMobile||'', altMobile: rec.altMobile||'',
    conditions, notes: rec.notes||'', confirmed:false,
  };
}

function showAlreadyRegisteredModal(){
  const rec = state.existingRecord;
  const dateStr = new Date(rec.submittedAt).toLocaleDateString('ar-SA', {year:'numeric',month:'long',day:'numeric'});
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" style="max-width:400px;">
      <div class="modal-top">
        <h2 style="border:none;margin:0;">بيانات مسجلة مسبقًا</h2>
      </div>
      <div class="warn-box" style="margin-bottom:16px;">
        تم تسجيل بيانات الحالة الصحية لهذا الطالب بتاريخ <b>${dateStr}</b>. يمكنكم تعديل البيانات إذا استجد أي جديد.
      </div>
      <div class="btn-row">
        <button class="btn btn-outline" id="cancel-edit">إلغاء</button>
        <button class="btn" id="proceed-edit">تعديل البيانات</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#cancel-edit').onclick = ()=>{ document.body.removeChild(overlay); };
  overlay.querySelector('#proceed-edit').onclick = ()=>{
    document.body.removeChild(overlay);
    state.formData = recordToFormData(state.existingRecord);
    state.editMode = true;
    state.formStep = 'fill';
    render();
  };
}

      <div class="confirm-box">
        <input type="checkbox" id="f-confirm" ${f.confirmed?'checked':''}>

      </div>

      <button class="btn btn-outline" id="f-back">رجوع</button>

}

function renderCondItem(c, f){
  const cs = f.conditions[c.key];
  return `
    <div class="cond-item">
      <label class="cond-head">
        <input type="checkbox" data-cond="${c.key}" ${cs.checked?'checked':''}>
        <div><div class="cond-title">${c.title}</div>${c.sub? `<div class="cond-sub">${c.sub}</div>`:''}</div>
      </label>
      ${c.hasDetail? `
        <div class="cond-detail ${cs.checked?'show':''}" data-detail-wrap="${c.key}">
          <textarea data-detail="${c.key}" placeholder="${c.placeholder}">${esc(cs.detail)}</textarea>
        </div>` : ''}
    </div>
  `;
}

function bindFormEvents(){
  document.getElementById('f-class').oninput = e => state.formData.classGrade = e.target.value;
  document.getElementById('f-section').oninput = e => state.formData.section = e.target.value;
  document.getElementById('f-mobile').oninput = e => state.formData.parentMobile = e.target.value;
  document.getElementById('f-alt-mobile').oninput = e => state.formData.altMobile = e.target.value;
  document.getElementById('f-notes').oninput = e => state.formData.notes = e.target.value;
  document.getElementById('f-confirm').onchange = e => state.formData.confirmed = e.target.checked;

  document.querySelectorAll('[data-cond]').forEach(el=>{
    el.onchange = e => {
      const key = e.target.dataset.cond;
      const checked = e.target.checked;
      const cDef = CONDITIONS.find(c=>c.key===key);
      if(cDef.exclusive && checked){
        CONDITIONS.forEach(c => { if(c.key!=='none') state.formData.conditions[c.key].checked = false; });
      } else if(checked){
        state.formData.conditions['none'].checked = false;
      }
      state.formData.conditions[key].checked = checked;
      render();
    };
  });
  document.querySelectorAll('[data-detail]').forEach(el=>{
    el.oninput = e => { state.formData.conditions[e.target.dataset.detail].detail = e.target.value; };
  });

  document.getElementById('f-back').onclick = ()=>{ state.formStep='select'; render(); };
  document.getElementById('f-submit').onclick = submitForm;
}

async function submitForm(){
  const f = state.formData;
  if(!f.classGrade.trim() || !f.section.trim() || !f.parentMobile.trim()){
    state.err = 'يرجى تعبئة الفصل والشعبة وجوال ولي الأمر.'; render(); return;
  }
  if(!f.confirmed){ state.err = 'يرجى تأكيد الإقرار قبل الإرسال.'; render(); return; }
  state.err = null;
  const btn = document.getElementById('f-submit');
  btn.disabled = true; btn.textContent = 'جاري الحفظ...';

  const now = new Date().toISOString();
  const prev = state.existingRecord && state.editMode ? state.existingRecord : null;

  const record = {
    nationalId: state.selId,
    studentName: state.selName,
    classGrade: f.classGrade.trim(),
    section: f.section.trim(),
    parentMobile: f.parentMobile.trim(),
    altMobile: f.altMobile.trim(),
    conditions: f.conditions,
    notes: f.notes.trim(),
    submittedAt: prev ? prev.submittedAt : now,
    updatedAt: now,
    editCount: prev ? (prev.editCount||0) + 1 : 0,
  };

  try{
    await saveSubmission(record);
    state.successRecord = record;
    state.formStep = 'success';
    state.existingRecord = null;
    render();
  }catch(err){
    state.err = 'تعذر حفظ البيانات، يرجى المحاولة مرة أخرى.';
    btn.disabled = false; btn.textContent = state.editMode? 'حفظ التعديل' : 'إرسال البيانات للمدرسة';
    render();
  }
}

/* ---------- STEP 3: SUCCESS + WHATSAPP CONFIRMATION ---------- */
function conditionsSummaryText(rec){
  const active = CONDITIONS.filter(c => c.key!=='none' && rec.conditions[c.key] && rec.conditions[c.key].checked);
  if(active.length===0) return 'لا يوجد حالات صحية مزمنة مسجلة.';
  return active.map(c=>{
    const d = rec.conditions[c.key].detail;
    return '- ' + c.title + (d? (': '+d) : '');
  }).join('\n');
}

function renderSuccess(){
  const rec = state.successRecord;

/* ---------- DASHBOARD ---------- */
async function loadSubmissions(){
  state.loadingDash = true; render();
  try{
    if(!sb) throw new Error('no supabase configured');
    const { data, error } = await sb.from('submissions').select('*');
    if(error) throw error;
    const items = (data||[]).map(rowToRecord);
    items.sort((a,b)=> new Date(b.updatedAt||b.submittedAt) - new Date(a.updatedAt||a.submittedAt));
    state.submissions = items;
    localSet('all_submissions', items);
  }catch(e){
    state.submissions = localGet('all_submissions') || [];
  }
  state.loadingDash = false;
  render();
}

function countConditions(rec){
  return CONDITIONS.filter(c => c.key!=='none' && rec.conditions[c.key] && rec.conditions[c.key].checked).length;
}

function getMissingStudents(){
  const subs = state.submissions || [];
  const registeredIds = new Set(subs.map(s=>s.nationalId));
  return (state.roster||[]).filter(s => !registeredIds.has(s.nationalId));
}

function renderDashboard(){
  if(state.loadingDash) return `<div class="card loading">جاري تحميل البيانات...</div>`;
  const subs = state.submissions || [];
  const q = state.search.trim();
  const filtered = q ? subs.filter(s => s.studentName.includes(q) || s.parentMobile.includes(q) || s.nationalId.includes(q)) : subs;
  const withConditions = subs.filter(s => countConditions(s) > 0).length;
  const missing = getMissingStudents();

  return `
    <div class="stat-row">
      <div class="stat"><b>${(state.roster||[]).length}</b><span>إجمالي الطلاب</span></div>
      <div class="stat"><b>${subs.length}</b><span>سجّلوا بياناتهم</span></div>
      <div class="stat"><b>${withConditions}</b><span>لديهم حالات صحية</span></div>
      <div class="stat missing"><b>${missing.length}</b><span>لم يسجلوا بعد</span></div>
    </div>

    <div class="dash-toolbar">
      <input type="text" placeholder="بحث بالاسم / رقم الهوية / الجوال" id="dash-search" value="${esc(state.search)}">
      <button class="btn btn-outline" id="dash-refresh">تحديث</button>
      <button class="btn btn-outline" id="dash-export">تصدير Excel</button>
    </div>

    <div class="btn-row" style="margin-bottom:16px;">
      <button class="btn ${state.showMissing?'':'btn-outline'}" id="toggle-missing">${state.showMissing? 'إخفاء قائمة غير المسجلين':'عرض الطلاب غير المسجلين ('+missing.length+')'}</button>
    </div>

    ${state.showMissing ? renderMissingSection(missing) : ''}

    ${!state.showMissing ? (filtered.length===0 ? `<div class="card empty">لا توجد نماذج مطابقة حتى الآن.</div>` :
      filtered.map(s => renderSubCard(s)).join('')) : ''}

    <div class="settings-link">
      <a id="open-settings">الإعدادات (الرمز / الموعد النهائي / كشف الطلاب)</a>
    </div>
    ${state.activeDetail ? renderDetailModal(state.activeDetail) : ''}
    ${state.showSettings ? renderSettingsModal() : ''}
  `;
}

function renderMissingSection(missing){
  if(missing.length===0) return `<div class="card empty">جميع طلاب الكشف قد سجّلوا بياناتهم 🎉</div>`;
  return `
    <div class="card">
      <h2>الطلاب الذين لم يسجّلوا حالاتهم الصحية (${missing.length})</h2>
      ${missing.map(s=>`<div class="missing-name"><span>${esc(s.name)}</span><span style="color:var(--muted)">${esc(s.nationalId)}</span></div>`).join('')}
      <button class="btn btn-outline" id="export-missing" style="margin-top:14px;">تصدير القائمة إلى Excel</button>
    </div>
  `;
}

function renderSubCard(s){
  const n = countConditions(s);
  const dateStr = new Date(s.updatedAt||s.submittedAt).toLocaleDateString('ar-SA', {year:'numeric',month:'long',day:'numeric'});
  return `
    <div class="sub-card" data-id="${esc(s.nationalId)}">
      <div class="sub-card-top">
        <div>
          <div class="sub-name">${esc(s.studentName)}</div>
          <div class="sub-meta">${esc(s.classGrade)} - ${esc(s.section)}  •  ${esc(s.parentMobile)}  •  ${dateStr}</div>
        </div>
        <div class="badge-row">
          ${s.editCount>0? `<span class="badge edited">تم التعديل (${s.editCount})</span>`:''}
          <span class="badge ${n===0?'none':''}">${n===0? 'لا يوجد' : n+' حالة'}</span>
          <span class="chev">‹</span>
        </div>
      </div>
    </div>
  `;
}

function openDetail(id){
  state.activeDetail = (state.submissions||[]).find(s=>s.nationalId===id);
  render();
}

function renderDetailModal(s){

  const submittedStr = new Date(s.submittedAt).toLocaleString('ar-SA');
  const updatedStr = new Date(s.updatedAt||s.submittedAt).toLocaleString('ar-SA');
  return `
    <div class="modal-overlay" id="detail-overlay">
      <div class="modal">
        <div class="modal-top">
          <h2 style="border:none;margin:0;">${esc(s.studentName)}</h2>
          <button class="modal-close" id="close-detail">×</button>
        </div>
        <div class="detail-row"><span>رقم الهوية</span><b>${esc(s.nationalId)}</b></div>
        <div class="detail-row"><span>الفصل / الشعبة</span><b>${esc(s.classGrade)} - ${esc(s.section)}</b></div>
        <div class="detail-row"><span>جوال ولي الأمر</span><b>${esc(s.parentMobile)}</b></div>
        ${s.altMobile? `<div class="detail-row"><span>جوال بديل</span><b>${esc(s.altMobile)}</b></div>`:''}
        <div class="detail-row"><span>تاريخ أول تسجيل</span><b>${submittedStr}</b></div>
        ${s.editCount>0? `<div class="detail-row"><span>آخر تعديل</span><b>${updatedStr} (تعديل رقم ${s.editCount})</b></div>`:''}
        <div style="margin-top:16px;">
          <label style="margin-bottom:8px;">الحالات الصحية المسجلة</label>
          ${active.length===0? `<p style="color:var(--muted);font-size:13.5px;">لا توجد حالات صحية مزمنة مسجلة.</p>` :
            active.map(c=>{ const detail = s.conditions[c.key].detail;
              return `<span class="cond-tag">${c.title}${detail? `<small>${esc(detail)}</small>`:''}</span>`; }).join('')}
        </div>
        ${s.notes? `<div class="notes-box"><b>ملاحظات:</b><br>${esc(s.notes)}</div>` : ''}
        <div class="btn-row" style="margin-top:16px;">
          <a href="https://wa.me/${normalizePhone(s.parentMobile)}?text=${encodeURIComponent('تأكيد بيانات الحالة الصحية للطالب '+s.studentName+'\\n\\n'+conditionsSummaryText(s))}" target="_blank" style="text-decoration:none;flex:1;">
            <button class="btn btn-wa" style="width:100%;">إرسال تأكيد واتساب</button>

function renderSettingsModal(){
  const deadlineLocal = state.settings.deadline ? toLocalInputValue(state.settings.deadline) : '';
  return `
    <div class="modal-overlay" id="settings-overlay">
      <div class="modal" style="max-width:420px;">
        <div class="modal-top">
          <h2 style="border:none;margin:0;">إعدادات الموجه الصحي</h2>
          <button class="modal-close" id="close-settings">×</button>
        </div>

        <div class="field">
          <label>رمز الدخول</label>
          <input type="text" inputmode="numeric" id="new-pin" placeholder="رمز جديد" value="">
        </div>

        <div class="field">
          <label>الموعد النهائي لتسجيل المرحلة الأولى</label>
          <input type="datetime-local" id="new-deadline" value="${deadlineLocal}">
        </div>

        <div class="err ${state.settingsErr?'show':''}">${state.settingsErr||''}</div>
        ${state.settingsMsg? `<div class="hint" style="color:var(--teal-700);font-weight:700;">${state.settingsMsg}</div>`:''}
        <button class="btn" id="save-settings" style="margin-top:10px;">حفظ الإعدادات</button>

        <div style="margin-top:22px;border-top:1px solid var(--line);padding-top:16px;">
          <label>استيراد / تحديث كشف الطلاب (Excel)</label>
          <div class="hint">الأعمدة المطلوبة: اسم الطالب، رقم هوية الطالب — سيتم إضافة الطلاب الجدد فقط دون حذف الحالات المسجلة حاليًا.</div>
          <div class="file-row">
            <input type="file" id="roster-file" accept=".xlsx,.xls,.csv">
          </div>
          <div class="hint" id="roster-import-status"></div>
        </div>
      </div>
    </div>
  `;
}

function toLocalInputValue(iso){
  const d = new Date(iso);
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,16);
}

function bindDashboardExtras(){
  const search = document.getElementById('dash-search');
  if(search) search.oninput = e => { state.search = e.target.value; render(); };

  const refresh = document.getElementById('dash-refresh');
  if(refresh) refresh.onclick = loadSubmissions;

  const exportBtn = document.getElementById('dash-export');
  if(exportBtn) exportBtn.onclick = exportExcel;

  const toggleMissing = document.getElementById('toggle-missing');
  if(toggleMissing) toggleMissing.onclick = ()=>{ state.showMissing = !state.showMissing; render(); };

  const exportMissing = document.getElementById('export-missing');
  if(exportMissing) exportMissing.onclick = exportMissingExcel;

  document.querySelectorAll('.sub-card').forEach(el=>{
    el.onclick = ()=> openDetail(el.dataset.id);
  });

  const openSettings = document.getElementById('open-settings');
  if(openSettings) openSettings.onclick = ()=>{ state.showSettings=true; state.settingsErr=null; state.settingsMsg=null; render(); };

  const closeSettings = document.getElementById('close-settings');
  if(closeSettings) closeSettings.onclick = ()=>{ state.showSettings=false; render(); };
  const settingsOverlay = document.getElementById('settings-overlay');
  if(settingsOverlay) settingsOverlay.onclick = (e)=>{ if(e.target===settingsOverlay){ state.showSettings=false; render(); } };

  const closeDetail = document.getElementById('close-detail');
  if(closeDetail) closeDetail.onclick = ()=>{ state.activeDetail=null; render(); };
  const detailOverlay = document.getElementById('detail-overlay');
  if(detailOverlay) detailOverlay.onclick = (e)=>{ if(e.target===detailOverlay){ state.activeDetail=null; render(); } };

  const savePin = document.getElementById('save-settings');
  if(savePin) savePin.onclick = async ()=>{
    const pinVal = document.getElementById('new-pin').value.trim();
    const deadlineVal = document.getElementById('new-deadline').value;
    const newSettings = { pin: pinVal || state.settings.pin, deadline: deadlineVal ? new Date(deadlineVal).toISOString() : state.settings.deadline };
    try{
      localSet('settings', newSettings);
      if(sb){
        const { error } = await sb.from('settings').upsert({ id:1, pin: newSettings.pin, deadline: newSettings.deadline });
        if(error) throw error;
      }
      state.settings = newSettings;
      state.settingsMsg = 'تم حفظ الإعدادات بنجاح';
      state.settingsErr = null;
      render();
    }catch(e){ state.settingsErr = 'تعذر الحفظ، حاول مرة أخرى'; render(); }
  };

  const rosterFile = document.getElementById('roster-file');
  if(rosterFile) rosterFile.onchange = handleRosterImport;
}

async function handleRosterImport(e){
  const file = e.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('roster-import-status');
  statusEl.textContent = 'جاري القراءة...';
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1});
    const newEntries = [];
    for(const row of rows){
      const name = (row[0]||'').toString().trim();
      let id = (row[1]!==undefined && row[1]!==null) ? row[1].toString().trim() : '';
      if(!name || !id || name==='اسم الطالب') continue;
      if(id.endsWith('.0')) id = id.slice(0,-2);
      newEntries.push({name, nationalId:id});
    }
    const existingIds = new Set(state.roster.map(s=>s.nationalId));
    let added = 0;
    const toInsert = [];
    newEntries.forEach(ent=>{
      if(!existingIds.has(ent.nationalId)){ state.roster.push(ent); existingIds.add(ent.nationalId); added++; toInsert.push(ent); }
    });
    localSet('roster', state.roster);
    if(sb && toInsert.length){
      await sb.from('roster').upsert(toInsert.map(s=>({national_id:s.nationalId, name:s.name})), {onConflict:'national_id'});
    }
    statusEl.textContent = `تمت إضافة ${added} طالب جديد إلى الكشف (الإجمالي الآن: ${state.roster.length}).`;
  }catch(err){
    statusEl.textContent = 'تعذر قراءة الملف، تأكد من أن العمود الأول للاسم والثاني لرقم الهوية.';
  }
}

function exportExcel(){
  const subs = state.submissions || [];
  const rows = subs.map(s=>{
    const row = {
      'اسم الطالب': s.studentName, 'رقم الهوية': s.nationalId,
      'الفصل': s.classGrade, 'الشعبة': s.section,
      'جوال ولي الأمر': s.parentMobile, 'جوال بديل': s.altMobile||'',
      'تاريخ أول تسجيل': new Date(s.submittedAt).toLocaleString('ar-SA'),
      'آخر تعديل': s.editCount>0 ? new Date(s.updatedAt).toLocaleString('ar-SA') : '',
      'عدد مرات التعديل': s.editCount||0,
    };
    CONDITIONS.filter(c=>c.key!=='none').forEach(c=>{
      const cs = s.conditions[c.key];
      row[c.title] = cs && cs.checked ? (cs.detail || 'نعم') : '';
    });
    row['ملاحظات'] = s.notes || '';
    return row;
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'الحالات الصحية');
  XLSX.writeFile(wb, 'الحالات_الصحية_للطلاب.xlsx');
}

function exportMissingExcel(){
  const missing = getMissingStudents();
  const rows = missing.map(s => ({'اسم الطالب': s.name, 'رقم الهوية': s.nationalId}));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'غير مسجلين');
  XLSX.writeFile(wb, 'الطلاب_غير_المسجلين.xlsx');
}

/* ---------- HELPERS ---------- */
function normalizePhone(p){
  let d = (p||'').replace(/\D/g,'');
  if(d.startsWith('0')) d = '966' + d.slice(1);
  else if(!d.startsWith('966')) d = '966' + d;
  return d;
}
function esc(s){
  return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

render().then(startCountdownTicker);
