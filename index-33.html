<script>

   من: Supabase Dashboard → Settings → API
   ============================================================ */

const SUPABASE_ANON_KEY = 'sb_publishable_37p0wHFHCfBN5RPFP5Uu2A_ZPTfpq5Z';
/* ============================================================ */

const SETUP_NEEDED = SUPABASE_URL.indexOf('YOUR_SUPABASE') === 0 || SUPABASE_ANON_KEY.indexOf('YOUR_SUPABASE') === 0;
let sb = null;
if(!SETUP_NEEDED){
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

const LOCAL_PREFIX = 'hesham_health_';
function localGet(key){ try{ const v = localStorage.getItem(LOCAL_PREFIX+key); return v? JSON.parse(v): null; }catch(e){ return null; } }
function localSet(key, val){ try{ localStorage.setItem(LOCAL_PREFIX+key, JSON.stringify(val)); }catch(e){} }

function rowToRecord(row){
  return {
    nationalId: row.national_id,
    studentName: row.student_name,
    classGrade: row.class_grade,
    section: row.section,
    parentMobile: row.parent_mobile,
    altMobile: row.alt_mobile || '',
    conditions: row.conditions || {},
    notes: row.notes || '',
    submittedAt: row.submitted_at,
    updatedAt: row.updated_at,
    editCount: row.edit_count || 0,
    confirmationSent: !!row.confirmation_sent,
  };
}
function recordToRow(rec){
  return {
    national_id: rec.nationalId,
    student_name: rec.studentName,
    class_grade: rec.classGrade,
    section: rec.section,
    parent_mobile: rec.parentMobile,
    alt_mobile: rec.altMobile,
    conditions: rec.conditions,
    notes: rec.notes,
    submitted_at: rec.submittedAt,
    updated_at: rec.updatedAt,
    edit_count: rec.editCount,
    confirmation_sent: !!rec.confirmationSent,
  };
}

async function fetchSubmission(nationalId){
  if(!sb){ return localGet('sub_'+nationalId); }
  try{
    const { data, error } = await sb.from('submissions').select('*').eq('national_id', nationalId).maybeSingle();
    if(error) throw error;
    const rec = data ? rowToRecord(data) : null;
    if(rec) localSet('sub_'+nationalId, rec);
    return rec;
  }catch(e){
    return localGet('sub_'+nationalId);
  }
}

async function saveSubmission(record){
  localSet('sub_'+record.nationalId, record);
  if(!sb) return true;
  const { error } = await sb.from('submissions').upsert(recordToRow(record), {onConflict:'national_id'});
  if(error) throw error;
  return true;

/* ---------- INIT / STORAGE ---------- */
async function ensureRoster(){
  if(state.roster) return state.roster;
  if(!sb){
    state.roster = localGet('roster') || ROSTER_SEED.map(s=>({name:s.n, nationalId:s.i}));
    return state.roster;
  }
  try{
    const { data, error } = await sb.from('roster').select('national_id,name');
    if(error) throw error;
    if(data && data.length > 0){
      state.roster = data.map(r=>({name:r.name, nationalId:r.national_id}));
    } else {
      const seed = ROSTER_SEED.map(s=>({name:s.n, nationalId:s.i}));
      const rows = seed.map(s=>({national_id:s.nationalId, name:s.name}));
      await sb.from('roster').upsert(rows, {onConflict:'national_id'});
      state.roster = seed;
    }
    localSet('roster', state.roster);
  }catch(e){
    state.roster = localGet('roster') || ROSTER_SEED.map(s=>({name:s.n, nationalId:s.i}));
  }
  return state.roster;
}

function fillTemplate(tpl, vars){
  return (tpl||'').replace(/\{(\w+)\}/g, (m,k)=> (vars[k]!==undefined? vars[k] : m));
}

async function ensureSettings(){
  if(state.settings) return state.settings;
  const fallbackDefault = () => {
    const d = new Date(); d.setDate(d.getDate()+DEFAULT_DEADLINE_DAYS);
    return {
      pin:'123456', deadline: d.toISOString(), academicYear:'1447/1448هـ',
      healthCounselorPhone:'', schoolPhone:'', studentCounselorPhone:'',
      msgConfirmation: DEFAULT_MSG_CONFIRMATION, msgReassurance: DEFAULT_MSG_REASSURANCE, msgReminder: DEFAULT_MSG_REMINDER,
    };
  };
  if(!sb){
    state.settings = localGet('settings') || fallbackDefault();
    return state.settings;
  }
  try{
    const { data, error } = await sb.from('settings').select('*').eq('id',1).maybeSingle();
    if(error) throw error;
    if(data){
      const def = fallbackDefault();
      state.settings = {
        pin: data.pin, deadline: data.deadline, academicYear: data.academic_year || def.academicYear,
        healthCounselorPhone: data.health_counselor_phone || '', schoolPhone: data.school_phone || '', studentCounselorPhone: data.student_counselor_phone || '',
        msgConfirmation: data.msg_confirmation || def.msgConfirmation,
        msgReassurance: data.msg_reassurance || def.msgReassurance,
        msgReminder: data.msg_reminder || def.msgReminder,
      };
    } else {
      const def = fallbackDefault();
      await sb.from('settings').insert({
        id:1, pin: def.pin, deadline: def.deadline, academic_year: def.academicYear,
        health_counselor_phone: def.healthCounselorPhone, school_phone: def.schoolPhone, student_counselor_phone: def.studentCounselorPhone,
        msg_confirmation: def.msgConfirmation, msg_reassurance: def.msgReassurance, msg_reminder: def.msgReminder,
      });
      state.settings = def;
    }
    localSet('settings', state.settings);
  }catch(e){
    state.settings = localGet('settings') || fallbackDefault();
  }
  return state.settings;
}

function switchTab(t){
  state.tab = t; state.activeDetail=null;

}

/* ---------- SESSION PERSISTENCE ---------- */
let initialRestoreDone = false;
function restoreSessions(){
  if(initialRestoreDone) return;
  initialRestoreDone = true;
  if(localGet('dash_unlocked')){
    state.dashUnlocked = true;
    if(localGet('dash_tab_active')) state.tab = 'dash';
  }
  if(!state.selName){
    const saved = localGet('parent_session');
    if(saved && saved.name && saved.nationalId){
      state.selName = saved.name;
      state.selId = saved.nationalId;
      state.parentSession = true;
      if(saved.formStep === 'success' && saved.successRecord){
        state.successRecord = saved.successRecord;
        state.editMode = !!saved.editMode;
        state.formStep = 'success';
      } else {
        state.formStep = 'select';
      }
    }
  }
}
function saveParentSession(){
  localSet('parent_session', {
    name: state.selName, nationalId: state.selId,
    formStep: state.formStep, editMode: state.editMode,
    successRecord: state.successRecord || null,
  });
}

/* ---------- COUNTDOWN ---------- */
let countdownTimer = null;
function renderCountdown(){
  const deadline = state.settings ? new Date(state.settings.deadline) : null;
  if(!deadline) return '';
  const diff = deadline - new Date();
  if(diff <= 0){
    return `<div class="countdown-banner closed">⏱️ انتهت المهلة المحددة لتسجيل بيانات المرحلة الأولى — لا يزال بإمكانكم التسجيل، لكن يرجى الإسراع</div>`;
  }
  const days = Math.floor(diff/86400000);
  const hours = Math.floor((diff%86400000)/3600000);
  const mins = Math.floor((diff%3600000)/60000);
  const secs = Math.floor((diff%60000)/1000);
  const urgent = diff < 3*86400000;
  return `
    <div class="countdown-banner ${urgent?'urgent':''}" id="countdown-box">
      <span>⏱️ الوقت المتبقي لإغلاق تسجيل المرحلة الأولى</span>
      <span class="countdown-time" id="countdown-time">${days} يوم ${pad(hours)}:${pad(mins)}:${pad(secs)}</span>
    </div>`;
}
function pad(n){ return n.toString().padStart(2,'0'); }
function startCountdownTicker(){
  if(countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(()=>{
    const box = document.getElementById('countdown-time');
    if(!box || !state.settings) return;
    const diff = new Date(state.settings.deadline) - new Date();
    if(diff<=0){ render(); return; }
    const days = Math.floor(diff/86400000);
    const hours = Math.floor((diff%86400000)/3600000);
    const mins = Math.floor((diff%3600000)/60000);
    const secs = Math.floor((diff%60000)/1000);
    box.textContent = `${days} يوم ${pad(hours)}:${pad(mins)}:${pad(secs)}`;
  }, 1000);
}

/* ---------- STEP 1: SELECT STUDENT ---------- */
function sortedRoster(){
  return [...(state.roster||[])].sort((a,b)=> a.name.localeCompare(b.name, 'ar'));
}

function renderSelect(){
  const roster = sortedRoster();
  return `
    <div class="card">

      <div class="field">
        <label>اسم الطالب</label>
        <select id="sel-name">
          <option value="">-- اختر اسم الطالب --</option>
          ${roster.map(s => `<option value="${esc(s.name)}" ${state.selName===s.name?'selected':''}>${esc(s.name)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>الرقم السري (رقم هوية الطالب)</label>
        <input type="text" id="sel-id" inputmode="numeric" placeholder="أدخل رقم الهوية" value="${esc(state.selId)}">
        <div class="hint">الرقم السري هو رقم هوية الطالب المسجل لدى المدرسة.</div>
      </div>
      <div class="err ${state.selErr?'show':''}">${state.selErr||''}</div>
      <button class="btn" id="sel-continue">متابعة</button>
    </div>
    <p class="footnote">إذا لم تجد اسم الطالب في القائمة، يرجى التواصل مع إدارة المدرسة.</p>
  `;
}

function bindSelectEvents(){
  const nameSelect = document.getElementById('sel-name');
  nameSelect.onchange = e => { state.selName = e.target.value; };

  document.getElementById('sel-id').oninput = e => state.selId = e.target.value;

  document.getElementById('sel-continue').onclick = async ()=>{
    const name = state.selName.trim();
    const id = state.selId.trim();
    if(!name || !id){ state.selErr = 'يرجى إدخال اسم الطالب والرقم السري.'; render(); return; }
    const match = state.roster.find(s => s.name === name);
    if(!match){ state.selErr = 'لم يتم العثور على هذا الاسم ضمن كشف الطلاب، يرجى اختيار الاسم من القائمة المنسدلة.'; render(); return; }
    if(match.nationalId !== id){ state.selErr = 'الرقم السري غير مطابق لهذا الطالب.'; render(); return; }
    state.selErr = null;

    // check existing submission
    let existing = await fetchSubmission(id);

    if(existing && !state.editMode){
      state.existingRecord = existing;
      state.selErr = null;
      render();
      showAlreadyRegisteredModal();
      return;
    }

    // proceed to fill form (new or confirmed edit)
    if(existing){
      state.formData = recordToFormData(existing);
      state.editMode = true;
    } else {
      state.formData = emptyForm();
      state.editMode = false;
    }
    state.formStep = 'fill';
    state.parentSession = true;
    saveParentSession();
    render();
  };
}

function recordToFormData(rec){
  const conditions = {};
  CONDITIONS.forEach(c => conditions[c.key] = rec.conditions[c.key] ? {...rec.conditions[c.key]} : {checked:false, detail:''});
  return {
    classGrade: rec.classGrade||'', section: rec.section||'',
    parentMobile: rec.parentMobile||'', altMobile: rec.altMobile||'',
    conditions, notes: rec.notes||'', confirmed:false,
  };
}

function showAlreadyRegisteredModal(){
  const rec = state.existingRecord;
  const dateStr = new Date(rec.submittedAt).toLocaleDateString('ar-SA', {year:'numeric',month:'long',day:'numeric'});

  overlay.className = 'modal-overlay';
  overlay.innerHTML = `

function renderCondItem(c, f){
  const cs = f.conditions[c.key];
  return `
    <div class="cond-item">
      <label class="cond-head">
        <input type="checkbox" data-cond="${c.key}" ${cs.checked?'checked':''}>
        <div><div class="cond-title">${c.title}</div>${c.sub? `<div class="cond-sub">${c.sub}</div>`:''}</div>
      </label>
      ${c.hasDetail? `
        <div class="cond-detail ${cs.checked?'show':''}" data-detail-wrap="${c.key}">
          <textarea data-detail="${c.key}" placeholder="${c.placeholder}">${esc(cs.detail)}</textarea>
        </div>` : ''}
    </div>
  `;
}

function bindFormEvents(){
  document.getElementById('f-class').oninput = e => state.formData.classGrade = e.target.value;
  document.getElementById('f-section').oninput = e => state.formData.section = e.target.value;
  document.getElementById('f-mobile').oninput = e => state.formData.parentMobile = e.target.value;
  document.getElementById('f-alt-mobile').oninput = e => state.formData.altMobile = e.target.value;
  document.getElementById('f-notes').oninput = e => state.formData.notes = e.target.value;
  document.getElementById('f-confirm').onchange = e => state.formData.confirmed = e.target.checked;

  document.querySelectorAll('[data-cond]').forEach(el=>{
    el.onchange = e => {
      const key = e.target.dataset.cond;
      const checked = e.target.checked;
      const cDef = CONDITIONS.find(c=>c.key===key);
      if(cDef.exclusive && checked){
        CONDITIONS.forEach(c => { if(c.key!=='none') state.formData.conditions[c.key].checked = false; });
      } else if(checked){
        state.formData.conditions['none'].checked = false;
      }
      state.formData.conditions[key].checked = checked;
      render();
    };
  });
  document.querySelectorAll('[data-detail]').forEach(el=>{
    el.oninput = e => { state.formData.conditions[e.target.dataset.detail].detail = e.target.value; };
  });

  document.getElementById('f-back').onclick = ()=>{ state.formStep='select'; render(); };
  document.getElementById('f-submit').onclick = submitForm;
}

async function submitForm(){
  const f = state.formData;
  if(!f.classGrade.trim() || !f.section.trim() || !f.parentMobile.trim()){
    state.err = 'يرجى تعبئة الفصل والشعبة وجوال ولي الأمر.'; render(); return;
  }
  if(!f.confirmed){ state.err = 'يرجى تأكيد الإقرار قبل الإرسال.'; render(); return; }
  state.err = null;
  const btn = document.getElementById('f-submit');
  btn.disabled = true; btn.textContent = 'جاري الحفظ...';

  const now = new Date().toISOString();
  const prev = state.existingRecord && state.editMode ? state.existingRecord : null;

  const record = {
    nationalId: state.selId,
    studentName: state.selName,
    classGrade: f.classGrade.trim(),
    section: f.section.trim(),
    parentMobile: f.parentMobile.trim(),
    altMobile: f.altMobile.trim(),
    conditions: f.conditions,
    notes: f.notes.trim(),
    submittedAt: prev ? prev.submittedAt : now,
    updatedAt: now,
    editCount: prev ? (prev.editCount||0) + 1 : 0,
    confirmationSent: false,
  };

  try{
    await saveSubmission(record);
    state.successRecord = record;
    state.successImageShown = false;
    state.formStep = 'success';
    state.existingRecord = null;
    saveParentSession();
    render();
  }catch(err){
    state.err = 'تعذر حفظ البيانات، يرجى المحاولة مرة أخرى.';
    btn.disabled = false; btn.textContent = state.editMode? 'حفظ التعديل' : 'إرسال البيانات للمدرسة';
    render();
  }
}

/* ---------- STEP 3: SUCCESS + WHATSAPP CONFIRMATION ---------- */
function conditionsSummaryText(rec){
  const active = CONDITIONS.filter(c => c.key!=='none' && rec.conditions[c.key] && rec.conditions[c.key].checked);
  if(active.length===0) return 'لا يوجد حالات صحية مزمنة مسجلة.';
  return active.map(c=>{
    const d = rec.conditions[c.key].detail;
    return '- ' + c.title + (d? (': '+d) : '');
  }).join('\n');
}

function renderSuccess(){
  const rec = state.successRecord;
  const dateStr = new Date(rec.updatedAt).toLocaleString('ar-SA');
  return `

/* ---------- DASHBOARD ---------- */
async function loadSubmissions(){
  state.loadingDash = true; render();
  try{
    if(!sb) throw new Error('no supabase configured');
    const { data, error } = await sb.from('submissions').select('*');
    if(error) throw error;
    const items = (data||[]).map(rowToRecord);
    items.sort((a,b)=> new Date(b.updatedAt||b.submittedAt) - new Date(a.updatedAt||a.submittedAt));
    state.submissions = items;
    localSet('all_submissions', items);
  }catch(e){
    state.submissions = localGet('all_submissions') || [];
  }
  state.loadingDash = false;
  render();
  subscribeRealtime();
}

let realtimeChannel = null;
function subscribeRealtime(){
  if(!sb || realtimeChannel) return;
  try{
    realtimeChannel = sb.channel('submissions-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'submissions' }, (payload) => {
        if(!state.submissions) return;
        if(payload.eventType === 'DELETE'){
          const oldId = payload.old && payload.old.national_id;
          state.submissions = state.submissions.filter(s=>s.nationalId!==oldId);
        } else {
          const rec = rowToRecord(payload.new);
          const idx = state.submissions.findIndex(s=>s.nationalId===rec.nationalId);
          if(idx>=0) state.submissions[idx] = rec; else state.submissions.unshift(rec);
        }
        localSet('all_submissions', state.submissions);
        if(state.tab === 'dash' && state.dashUnlocked && !state.loadingDash){
          render();
        }
      })
      .subscribe();
  }catch(e){ realtimeChannel = null; }
}

function countConditions(rec){
  return CONDITIONS.filter(c => c.key!=='none' && rec.conditions[c.key] && rec.conditions[c.key].checked).length;
}

function getMissingStudents(){
  const subs = state.submissions || [];
  const registeredIds = new Set(subs.map(s=>s.nationalId));
  return (state.roster||[]).filter(s => !registeredIds.has(s.nationalId));
}

function toLocalInputValue(iso){
  const d = new Date(iso);
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,16);
}

    const name = document.getElementById('add-student-name').value.trim();
    const id = document.getElementById('add-student-id').value.trim();
    if(!name || !/^\d+$/.test(id)){ state.addStudentErr = 'يرجى إدخال اسم صحيح ورقم هوية أرقام فقط.'; render(); return; }
    if((state.roster||[]).some(s=>s.nationalId===id)){ state.addStudentErr = 'رقم الهوية مستخدم بالفعل لطالب آخر.'; render(); return; }
    try{
      if(sb){
        const { error } = await sb.from('roster').upsert({national_id:id, name}, {onConflict:'national_id'});
        if(error) throw error;
      }
      state.roster.push({name, nationalId:id});
      localSet('roster', state.roster);
      state.showAddStudent = false; state.addStudentErr = null;
      render();
    }catch(e){ state.addStudentErr = 'تعذر الإضافة، حاول مرة أخرى.'; render(); }
  };

  // delete from roster
  document.querySelectorAll('[data-del-roster]').forEach(el=>{
    el.onclick = async (e)=>{
      e.stopPropagation();
      const id = el.dataset.delRoster; const name = el.dataset.delRosterName;
      if(!confirm('هل تريد حذف الطالب "'+name+'" من كشف الطلاب؟ (بسبب النقل من المدرسة مثلاً)\nسيتم أيضًا حذف بياناته الصحية المسجلة إن وجدت.')) return;
      try{
        if(sb){
          await sb.from('roster').delete().eq('national_id', id);
          await sb.from('submissions').delete().eq('national_id', id);
        }
        state.roster = state.roster.filter(s=>s.nationalId!==id);
        state.submissions = (state.submissions||[]).filter(s=>s.nationalId!==id);
        localSet('roster', state.roster);
        localSet('sub_'+id, null);
        render();
      }catch(err){ alert('تعذر الحذف، حاول مرة أخرى.'); }
    };
  });

  // per-condition edit/delete within the condition log
  document.querySelectorAll('[data-edit-cond]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const [id, key] = el.dataset.editCond.split(':');
      state.editingCond = {id, key};
      render();
    };
  });
  const cancelCondEdit = document.getElementById('cancel-cond-edit');
  if(cancelCondEdit) cancelCondEdit.onclick = ()=>{ state.editingCond = null; render(); };
  document.querySelectorAll('[data-cancel-cond-edit]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); state.editingCond = null; render(); };
  });
  document.querySelectorAll('[data-save-cond]').forEach(el=>{
    el.onclick = async (e)=>{
      e.stopPropagation();
      const [id, key] = el.dataset.saveCond.split(':');
      const rec = (state.submissions||[]).find(s=>s.nationalId===id);
      if(!rec) return;
      const textarea = document.getElementById('cond-edit-textarea');
      const newDetail = textarea ? textarea.value : '';
      const updated = {...rec, conditions:{...rec.conditions, [key]:{...rec.conditions[key], detail:newDetail}}};
      try{ await saveSubmission(updated); }catch(err){}
      state.submissions = state.submissions.map(s=> s.nationalId===id? updated : s);
      state.editingCond = null;
      render();
    };
  });
  document.querySelectorAll('[data-del-cond]').forEach(el=>{
    el.onclick = async (e)=>{
      e.stopPropagation();
      const [id, key] = el.dataset.delCond.split(':');
      const cDef = CONDITIONS.find(c=>c.key===key);
      if(!confirm('هل تريد حذف حالة "'+(cDef?cDef.title:key)+'" من سجل هذا الطالب؟')) return;
      const rec = (state.submissions||[]).find(s=>s.nationalId===id);
      if(!rec) return;
      const updated = {...rec, conditions:{...rec.conditions, [key]:{checked:false, detail:''}}};
      try{ await saveSubmission(updated); }catch(err){}
      state.submissions = state.submissions.map(s=> s.nationalId===id? updated : s);
      render();
    };
  });

  document.querySelectorAll('.sub-card').forEach(el=>{
    el.onclick = ()=> openDetail(el.dataset.id);
  });
  document.querySelectorAll('[data-open-detail]').forEach(el=>{
    el.onclick = ()=> openDetail(el.dataset.openDetail);
  });

  const openSettings = document.getElementById('open-settings');
  if(openSettings) openSettings.onclick = ()=>{ state.showSettings=true; state.settingsErr=null; state.settingsMsg=null; render(); };

  const closeSettings = document.getElementById('close-settings');
  if(closeSettings) closeSettings.onclick = ()=>{ state.showSettings=false; render(); };
  const settingsOverlay = document.getElementById('settings-overlay');
  if(settingsOverlay) settingsOverlay.onclick = (e)=>{ if(e.target===settingsOverlay){ state.showSettings=false; render(); } };

  const closeDetail = document.getElementById('close-detail');
  if(closeDetail) closeDetail.onclick = ()=>{ state.activeDetail=null; state.editingId=false; state.idEditErr=null; render(); };
  const detailOverlay = document.getElementById('detail-overlay');
  if(detailOverlay) detailOverlay.onclick = (e)=>{ if(e.target===detailOverlay){ state.activeDetail=null; state.editingId=false; state.idEditErr=null; render(); } };

  const startIdEdit = document.getElementById('start-id-edit');
  if(startIdEdit) startIdEdit.onclick = ()=>{ state.editingId = true; state.idEditErr=null; render(); };
  const cancelIdEdit = document.getElementById('cancel-id-edit');
  if(cancelIdEdit) cancelIdEdit.onclick = ()=>{ state.editingId = false; state.idEditErr=null; render(); };
  const saveIdEdit = document.getElementById('save-id-edit');
  if(saveIdEdit) saveIdEdit.onclick = async ()=>{
    const newId = document.getElementById('edit-id-input').value.trim();
    const oldId = state.activeDetail.nationalId;
    if(!/^\d+$/.test(newId)){ state.idEditErr='رقم الهوية يجب أن يتكون من أرقام فقط.'; render(); return; }
    if(newId === oldId){ state.editingId=false; render(); return; }
    if((state.submissions||[]).some(s=>s.nationalId===newId)){
      state.idEditErr = 'رقم الهوية هذا مستخدم لطالب آخر مسجّل بالفعل.'; render(); return;
    }
    try{
      const updated = {...state.activeDetail, nationalId:newId};
      if(sb){
        const { error } = await sb.from('submissions').update({national_id:newId}).eq('national_id', oldId);
        if(error) throw error;
      }
      localSet('sub_'+oldId, null);
      localSet('sub_'+newId, updated);
      state.submissions = (state.submissions||[]).map(s=> s.nationalId===oldId? updated : s);
      state.activeDetail = updated;
      state.editingId = false; state.idEditErr = null;
      render();
    }catch(e){ state.idEditErr = 'تعذر حفظ التعديل، حاول مرة أخرى.'; render(); }
  };

  const sendConfirmWa = document.getElementById('send-confirm-wa');
  if(sendConfirmWa) sendConfirmWa.onclick = async ()=>{
    const s = state.activeDetail;
    const msg = fillTemplate(state.settings.msgConfirmation, {
      name: s.studentName, class: s.classGrade, section: s.section,
      conditions: conditionsSummaryText(s), date: new Date(s.updatedAt||s.submittedAt).toLocaleString('ar-SA'),
    });
    window.open('https://wa.me/'+normalizePhone(s.parentMobile)+'?text='+encodeURIComponent(msg), '_blank');
    const updated = {...s, confirmationSent:true};
    try{ await saveSubmission(updated); }catch(e){}
    state.submissions = (state.submissions||[]).map(x=> x.nationalId===s.nationalId? updated : x);
    state.activeDetail = updated;
    render();
  };

  const sendReassureWa = document.getElementById('send-reassure-wa');
  if(sendReassureWa) sendReassureWa.onclick = ()=>{
    const s = state.activeDetail;
    const msg = fillTemplate(state.settings.msgReassurance, { name: s.studentName, class: s.classGrade, section: s.section });
    window.open('https://wa.me/'+normalizePhone(s.parentMobile)+'?text='+encodeURIComponent(msg), '_blank');
  };

  const deleteBtn = document.getElementById('delete-submission');
  if(deleteBtn) deleteBtn.onclick = ()=> confirmDeleteSubmission(state.activeDetail);

  const savePin = document.getElementById('save-settings');
  if(savePin) savePin.onclick = async ()=>{
    const pinVal = document.getElementById('new-pin').value.trim();
    const yearVal = document.getElementById('new-year').value.trim();
    const deadlineVal = document.getElementById('new-deadline').value;
    const phoneHealthVal = document.getElementById('new-phone-health').value.trim();
    const phoneSchoolVal = document.getElementById('new-phone-school').value.trim();
    const phoneStudentCounselorVal = document.getElementById('new-phone-student-counselor').value.trim();
    const msgConfirmationVal = document.getElementById('new-msg-confirmation').value;
    const msgReassuranceVal = document.getElementById('new-msg-reassurance').value;
    const msgReminderVal = document.getElementById('new-msg-reminder').value;
    if(pinVal && !/^\d{6}$/.test(pinVal)){
      state.settingsErr = 'رمز الدخول يجب أن يتكون من 6 أرقام بالضبط.';
      render(); return;
    }
    const newSettings = {
      pin: pinVal || state.settings.pin,
      deadline: deadlineVal ? new Date(deadlineVal).toISOString() : state.settings.deadline,
      academicYear: yearVal || state.settings.academicYear,
      healthCounselorPhone: phoneHealthVal,
      schoolPhone: phoneSchoolVal,
      studentCounselorPhone: phoneStudentCounselorVal,
      msgConfirmation: msgConfirmationVal || DEFAULT_MSG_CONFIRMATION,
      msgReassurance: msgReassuranceVal || DEFAULT_MSG_REASSURANCE,
      msgReminder: msgReminderVal || DEFAULT_MSG_REMINDER,
    };
    try{
      localSet('settings', newSettings);
      if(sb){
        const { error } = await sb.from('settings').upsert({
          id:1, pin: newSettings.pin, deadline: newSettings.deadline, academic_year: newSettings.academicYear,
          health_counselor_phone: newSettings.healthCounselorPhone, school_phone: newSettings.schoolPhone, student_counselor_phone: newSettings.studentCounselorPhone,
          msg_confirmation: newSettings.msgConfirmation, msg_reassurance: newSettings.msgReassurance, msg_reminder: newSettings.msgReminder,
        });
        if(error) throw error;
      }
      state.settings = newSettings;
      state.settingsMsg = 'تم حفظ الإعدادات بنجاح';
      state.settingsErr = null;
      render();
    }catch(e){ state.settingsErr = 'تعذر الحفظ، حاول مرة أخرى'; render(); }
  };

  const rosterFile = document.getElementById('roster-file');
  if(rosterFile) rosterFile.onchange = handleRosterImport;
}

async function handleRosterImport(e){
  const file = e.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('roster-import-status');
  statusEl.textContent = 'جاري القراءة...';
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1});
    const newEntries = [];
    for(const row of rows){
      const name = (row[0]||'').toString().trim();
      let id = (row[1]!==undefined && row[1]!==null) ? row[1].toString().trim() : '';
      if(!name || !id || name==='اسم الطالب') continue;
      if(id.endsWith('.0')) id = id.slice(0,-2);
      newEntries.push({name, nationalId:id});
    }
    const existingIds = new Set(state.roster.map(s=>s.nationalId));
    let added = 0;
    const toInsert = [];
    newEntries.forEach(ent=>{
      if(!existingIds.has(ent.nationalId)){ state.roster.push(ent); existingIds.add(ent.nationalId); added++; toInsert.push(ent); }
    });
    localSet('roster', state.roster);
    if(sb && toInsert.length){
      await sb.from('roster').upsert(toInsert.map(s=>({national_id:s.nationalId, name:s.name})), {onConflict:'national_id'});
    }
    statusEl.textContent = `تمت إضافة ${added} طالب جديد إلى الكشف (الإجمالي الآن: ${state.roster.length}).`;
  }catch(err){
    statusEl.textContent = 'تعذر قراءة الملف، تأكد من أن العمود الأول للاسم والثاني لرقم الهوية.';
  }
}

function exportExcel(){
  const subs = state.submissions || [];
  const rows = subs.map(s=>{
    const row = {
      'اسم الطالب': s.studentName, 'رقم الهوية': s.nationalId,
      'الفصل': s.classGrade, 'الشعبة': s.section,
      'جوال ولي الأمر': s.parentMobile, 'جوال بديل': s.altMobile||'',
      'تاريخ أول تسجيل': new Date(s.submittedAt).toLocaleString('ar-SA'),
      'آخر تعديل': s.editCount>0 ? new Date(s.updatedAt).toLocaleString('ar-SA') : '',
      'عدد مرات التعديل': s.editCount||0,
    };
    CONDITIONS.filter(c=>c.key!=='none').forEach(c=>{
      const cs = s.conditions[c.key];
      row[c.title] = cs && cs.checked ? (cs.detail || 'نعم') : '';
    });
    row['ملاحظات'] = s.notes || '';
    return row;
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'الحالات الصحية');
  XLSX.writeFile(wb, 'الحالات_الصحية_للطلاب.xlsx');
}

function exportMissingExcel(){
  const missing = getMissingStudents();
  const rows = missing.map(s => ({'اسم الطالب': s.name, 'رقم الهوية': s.nationalId}));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'غير مسجلين');
  XLSX.writeFile(wb, 'الطلاب_غير_المسجلين.xlsx');
}

/* ---------- PRINTING ---------- */
function printRows(title, rows){
  const area = document.getElementById('print-area');
  if(!area) return;
  area.innerHTML = `
    <div class="print-header">ابتدائية هشام بن عبد الملك بالخرج<br>${esc(title)}</div>
    ${rows.map(r => `<div class="print-row"><span>${esc(r.label)}</span><span>${esc(r.sub||'')}</span></div>`).join('')}
  `;
  window.print();
}

function printCurrentStatView(){
  const view = state.statView;
  const subs = state.submissions || [];
  const roster = state.roster || [];
  if(view === 'all'){
    printRows('كل طلاب الكشف', roster.map(s=>({label:s.name, sub:s.nationalId})));
  } else if(view === 'registered'){
    printRows('الطلاب الذين سجّلوا بياناتهم', subs.map(s=>({label:s.studentName, sub:s.classGrade+' - '+s.section})));
  } else if(view === 'withConditions'){
    printRows('الطلاب الذين لديهم حالات صحية', subs.filter(s=>countConditions(s)>0).map(s=>({label:s.studentName, sub:countConditions(s)+' حالة'})));
  } else if(view === 'missing'){
    printRows('الطلاب الذين لم يسجّلوا حالاتهم الصحية', getMissingStudents().map(s=>({label:s.name, sub:s.nationalId})));
  }
}

function printByClassSection(){
  const subs = state.submissions || [];
  const groups = {};
  subs.forEach(s=>{
    const key = (s.classGrade||'—') + ' - ' + (s.section||'—');
    if(!groups[key]) groups[key] = [];
    groups[key].push(s);
  });
  const rows = [];
  Object.keys(groups).sort().forEach(key=>{
    rows.push({label:'——— '+key+' ———', sub:''});
    groups[key].forEach(s=>{
      rows.push({label:s.studentName, sub: countConditions(s)>0 ? (countConditions(s)+' حالة صحية') : 'لا يوجد'});
    });
  });
  printRows('كشف الطلاب حسب الفصل والشعبة', rows);
}

function printSingleReminder(name, nationalId){
  printRows('تنبيه تسجيل الحالة الصحية', [
    {label:'اسم الطالب', sub:name},
    {label:'رقم الهوية', sub:nationalId},
    {label:'يرجى تسجيل البيانات الصحية للطالب في أقرب وقت', sub:''},
  ]);
}

/* ---------- HELPERS ---------- */
function normalizePhone(p){
  let d = (p||'').replace(/\D/g,'');
  if(d.startsWith('0')) d = '966' + d.slice(1);
  else if(!d.startsWith('966')) d = '966' + d;
  return d;
}
function esc(s){
  return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

render().then(startCountdownTicker);
